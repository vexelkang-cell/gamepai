<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tank Duel</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#menu{position:fixed;inset:0;background:#111e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
button,input{font-size:18px;padding:12px 18px;border-radius:10px;border:0}
input{text-align:center;text-transform:uppercase;width:160px}
#fire{position:fixed;right:5%;bottom:10%;width:96px;height:96px;border-radius:50%;background:#e33a;color:#fff;font-weight:bold;border:2px solid #fff6}
#joy{position:fixed;left:4%;bottom:6%;width:140px;height:140px;border-radius:50%;background:#fff2;touch-action:none}
#knob{position:absolute;left:50px;top:50px;width:40px;height:40px;border-radius:50%;background:#fff9}
</style></head><body>
<canvas id="c"></canvas>
<div id="joy"><div id="knob"></div></div>
<button id="fire">TEMBAK</button>
<div id="menu">
  <h1>🛡️ Tank Duel</h1>
  <div>Pemain 1 dan 2 masukkan kode ruang yang sama</div>
  <input id="room" maxlength="8" placeholder="KODE">
  <button id="go">Masuk</button>
  <div id="info"></div>
  <small>Laptop: WASD/panah + Spasi</small>
</div>
<script>
// GANTI dengan alamat Worker kamu (tanpa https://)
const WS_HOST='NAMA-WORKER.USERNAME.workers.dev';

const W=800,H=480,cv=document.getElementById('c'),ctx=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const walls=[[360,170,80,20],[360,290,80,20],[150,200,20,80],[630,200,20,80],[200,60,100,20],[500,400,100,20]];
const PW={speed:['#3c3','S'],rapid:['#fc3','R'],shield:['#39f','P']};
let ws,role=null,st=null,started=false;
let inp={jx:0,jy:0,f:0},remote={jx:0,jy:0,f:0};
const mk=(x,y,a)=>({x,y,a,hp:5,cd:0,pw:null,pt:0});
const fresh=()=>({t:[mk(80,H/2,0),mk(W-80,H/2,Math.PI)],b:[],p:[],s:[0,0],over:0,spawn:5});
const $=id=>document.getElementById(id);

// ---------- Jaringan ----------
$('go').onclick=()=>{
  const code=$('room').value.trim().toUpperCase();
  if(!code){$('info').textContent='Isi kode ruang dulu';return}
  $('info').textContent='Menghubungkan...';
  ws=new WebSocket('wss://'+WS_HOST+'/ws?room='+code);
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='role'){role=m.role;$('info').textContent=role==='host'?'Menunggu pemain kedua...':'Terhubung, menunggu mulai...'}
    else if(m.t==='ready'){started=true;$('menu').style.display='none';if(role==='host')st=fresh()}
    else if(m.t==='i'){remote=m}
    else if(m.t==='s'){st=m.st}
    else if(m.t==='left'){started=false;st=null;$('menu').style.display='flex';$('info').textContent='Lawan keluar. Masuk lagi untuk main.'}
  };
  ws.onclose=()=>{if(!started)$('info').textContent='Gagal/terputus. Cek kode atau ruang penuh.'};
};
setInterval(()=>{
  if(!started||!ws||ws.readyState!==1)return;
  if(role==='host')ws.send(JSON.stringify({t:'s',st}));
  else ws.send(JSON.stringify({t:'i',jx:inp.jx,jy:inp.jy,f:inp.f}));
},33);

// ---------- Input ----------
const joy=$('joy'),knob=$('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=(e.clientX-cx)/70,dy=(e.clientY-cy)/70,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  inp.jx=dx;inp.jy=dy;knob.style.left=50+dx*50+'px';knob.style.top=50+dy*50+'px'}
joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};
joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jid=null;inp.jx=inp.jy=0;knob.style.left=knob.style.top='50px'};
const fb=$('fire');fb.onpointerdown=()=>inp.f=1;fb.onpointerup=fb.onpointercancel=fb.onpointerleave=()=>inp.f=0;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function kb(){const k=keys;let x=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),y=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);
  if(x||y){inp.jx=x;inp.jy=y}else if(jid===null){inp.jx=inp.jy=0}
  if(k[' '])inp.f=1;else if(!fb.matches(':active'))inp.f=inp.f&&k[' ']?1:inp.f}

// ---------- Simulasi (hanya host) ----------
const hitW=(x,y,r)=>x<r||y<r||x>W-r||y>H-r||walls.some(w=>x+r>w[0]&&x-r<w[0]+w[2]&&y+r>w[1]&&y-r<w[1]+w[3]);
function step(dt){
  if(st.over>0){st.over-=dt;if(st.over<=0){const s=st.s;st=fresh();st.s=s}return}
  st.t.forEach((t,i)=>{
    const u=i===0?inp:remote;t.cd-=dt;if(t.pw){t.pt-=dt;if(t.pt<=0)t.pw=null}
    const m=Math.hypot(u.jx,u.jy);
    if(m>.2){t.a=Math.atan2(u.jy,u.jx);const sp=120*(t.pw==='speed'?1.6:1)*dt,nx=t.x+Math.cos(t.a)*sp,ny=t.y+Math.sin(t.a)*sp;
      if(!hitW(nx,t.y,16))t.x=nx;if(!hitW(t.x,ny,16))t.y=ny}
    if(u.f&&t.cd<=0){t.cd=t.pw==='rapid'?.18:.55;st.b.push({x:t.x+Math.cos(t.a)*24,y:t.y+Math.sin(t.a)*24,vx:Math.cos(t.a)*360,vy:Math.sin(t.a)*360,o:i})}
    st.p=st.p.filter(p=>{if(Math.hypot(p.x-t.x,p.y-t.y)<22){t.pw=p.k;t.pt=8;return false}return true});
  });
  st.b=st.b.filter(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(hitW(b.x,b.y,3))return false;
    const t=st.t[1-b.o];
    if(Math.hypot(b.x-t.x,b.y-t.y)<18){if(!(t.pw==='shield'))t.hp--;
      if(t.hp<=0){st.s[b.o]++;st.over=3}return false}
    return true});
  st.spawn-=dt;if(st.spawn<=0&&st.p.length<2){st.spawn=7;
    for(let n=0;n<20;n++){const x=60+Math.random()*(W-120),y=60+Math.random()*(H-120);
      if(!hitW(x,y,16)){st.p.push({x,y,k:Object.keys(PW)[Math.random()*3|0]});break}}}
}

// ---------- Gambar ----------
function drawTank(t,c,me){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.a);
  ctx.fillStyle=c;ctx.fillRect(-16,-13,32,26);ctx.fillStyle='#fff9';ctx.fillRect(0,-3,26,6);
  if(t.pw==='shield'){ctx.strokeStyle='#39f';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,24,0,7);ctx.stroke()}
  ctx.restore();
  ctx.fillStyle='#333';ctx.fillRect(t.x-18,t.y-30,36,5);ctx.fillStyle='#3d3';ctx.fillRect(t.x-18,t.y-30,36*Math.max(0,t.hp)/5,5);
  if(me){ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('KAMU',t.x,t.y+34)}}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#111';ctx.fillRect(0,0,cv.width,cv.height);
  const s=Math.min(cv.width/W,cv.height/H);ctx.setTransform(s,0,0,s,(cv.width-W*s)/2,(cv.height-H*s)/2);
  ctx.fillStyle='#2a3a2a';ctx.fillRect(0,0,W,H);
  if(!st)return;
  ctx.fillStyle='#777';walls.forEach(w=>ctx.fillRect(...w));
  st.p.forEach(p=>{ctx.fillStyle=PW[p.k][0];ctx.beginPath();ctx.arc(p.x,p.y,12,0,7);ctx.fill();ctx.fillStyle='#000';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(PW[p.k][1],p.x,p.y+5)});
  ctx.fillStyle='#ff0';st.b.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()});
  const mi=role==='host'?0:1;
  drawTank(st.t[0],'#3b82f6',mi===0);drawTank(st.t[1],'#ef4444',mi===1);
  ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText(st.s[0]+'  -  '+st.s[1],W/2,28);
  ctx.font='11px sans-serif';ctx.fillText('S=Cepat  R=Tembak cepat  P=Perisai',W/2,H-8);
  if(st.over>0){ctx.font='bold 36px sans-serif';ctx.fillText(st.t[mi].hp<=0?'KALAH':'MENANG!',W/2,H/2)}
}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;kb();
  if(started&&role==='host'&&st)step(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
