function meter(name,val){return `<div class="meter canva-progress"><div class="meter-label"><span>${name}</span><span>${val}%</span></div><div class="track"><div class="fill" style="width:${val}%"></div></div></div>`}
function renderFree(){let f=foods[state.food];app.innerHTML=`<section class="canva-section"><div class="section-title"><div><span class="eyebrow">MODE EKSPERIMEN</span><h1>Simulasi bebas</h1><p class="subtle">Atur makanan dan kecepatan, lalu amati perjalanan dari mulut sampai anus.</p></div>${btn("← MENU UTAMA","home","small")}</div><div class="free-layout"><div class="panel cardpad canva-panel"><div class="stage-visual" id="free-visual">${scene(state.organ)}<div class="visual-caption" id="free-caption">${organs[state.organ].name} • ${state.playing?"Berjalan":"Dijeda"} • ${Math.floor(state.freeTick)}% tahap</div></div><div class="free-path">${organs.map((o,i)=>`<span class="${i===state.organ?"on":""}">${o.name}</span>`).join("")}</div><div class="controls">${btn(state.playing?"JEDA":"LANJUT / MULAI",state.playing?"pause":"play","primary")}${btn("RESET","freeReset")}${btn("PERCEPAT +","faster")}${btn("PERLAMBAT −","slower")}</div></div><aside class="panel cardpad canva-sidebar"><label class="field" for="free-food">PILIH MAKANAN<select id="free-food" class="canva-dropdown">${Object.keys(foods).map(k=>`<option ${state.food===k?"selected":""} value="${k}">${k.toUpperCase()}</option>`).join("")}</select></label><label class="field" for="free-speed">KECEPATAN SIMULASI · <span id="speed-value">${state.speed}×</span><input id="free-speed" class="canva-input" type="range" min="0.5" max="3" step="0.5" value="${state.speed}"></label><div class="mini-title">KOMPOSISI MAKANAN (PERBANDINGAN ILUSTRATIF)</div>${["carb","protein","fat","fiber"].map((k,n)=>meter(["Karbohidrat","Protein","Lemak","Serat"][n],f[k])).join("")}<div class="mini-title">HASIL PERJALANAN</div>${meter("Nutrisi terserap",state.absorbed)}${meter("Sisa makanan",state.waste)}<div class="narration canva-text" aria-live="polite"><b>${organs[state.organ].name}</b><br>${freeText()} ${state.organ===3?"Glukosa dan asam amino menuju darah; kilomikron menuju limfa.":""}</div><p class="subtle" style="font-size:12px">Model ini menyederhanakan proses biologis untuk pembelajaran; angka menunjukkan perubahan relatif, bukan pengukuran klinis.</p></aside></div><div class="mobile-actions">${btn(state.playing?'JEDA':'MULAI / LANJUT',state.playing?'pause':'play','primary')}${btn('RESET','freeReset')}${btn('⛶','fullscreen')}</div></section>`;syncVisual()}
function animateFree(now){if(!state.playing||state.page!=="free"||document.hidden)return;if(!lastFrame)lastFrame=now;const delta=Math.min(100,now-lastFrame);lastFrame=now;state.freeTick+=delta*state.speed/70;if(state.freeTick>=100){state.freeTick=0;if(state.organ<5){state.organ++;if(state.organ===3)state.absorbed=Math.min(90,Math.round((foods[state.food].carb+foods[state.food].protein+foods[state.food].fat)*.48));if(state.organ===4)state.waste=Math.max(9,Math.round((100-state.absorbed)*.65));renderFree()}else{stopFree();state.finished=true;renderFree();toast("Perjalanan selesai! Sertifikat tersedia.");completionTimer=setTimeout(()=>{if(state.page==="free")renderCertificate()},1800);return}}const caption=document.getElementById("free-caption");if(caption)caption.textContent=`${organs[state.organ].name} • Berjalan • ${Math.floor(state.freeTick)}% tahap`;frame=requestAnimationFrame(animateFree)}
function startFree(){if(state.playing)return;state.playing=true;lastFrame=0;renderFree();if(!document.hidden)frame=requestAnimationFrame(animateFree)}
function renderCertificate(){if(!state.finished)return;stopFree();state.page="certificate";app.innerHTML=`<section class="certificate canva-card"><span class="topline">DIGESTIVE LAB · SERTIFIKAT PENYELESAIAN</span><div style="font-size:58px;margin-top:25px;color:#17a996" aria-hidden="true">✳</div><h2>Simulasi Pencernaan Selesai!</h2><p class="lead" style="margin:15px auto">Selamat! Kamu telah menjelajahi perjalanan makanan melalui mulut, kerongkongan, lambung, usus halus, usus besar, dan anus.</p><p class="badge">SKOR PEMAHAMAN: ${state.score} POIN</p><div class="menu-actions" style="justify-content:center">${btn("JELAJAHI LAGI","learn","primary")}${btn("KUIS PENGETAHUAN","quiz")}${btn("MENU UTAMA","home")}</div></section>`}
function show(page){if(state.page==="free"&&page!=="free")stopFree();stopVisual();state.page=page;({home:renderHome,learn:renderLearn,organ:renderOrgan,encyclopedia:renderEncyclopedia,lab:renderLab,quiz:renderQuiz,quizResult:renderQuizResult,settings:renderSettings,free:renderFree,certificate:renderCertificate})[page]();window.scrollTo({top:0,behavior:reduced.matches?"instant":"smooth"})}
app.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b||b.disabled)return;const a=b.dataset.action;if(a.startsWith("step:")){doStep(a.slice(5));return}if(a.startsWith("answer:")){let [,i,n]=a.split(":").map(Number);if(state.answered[i]!==undefined)return;state.answered[i]=n;if(n===organs[i].answer)state.score+=10;renderOrgan();return}if(a.startsWith("quizAnswer:")){let n=Number(a.split(":")[1]),i=state.quizIndex;if(state.answered["q"+i]!==undefined)return;state.answered["q"+i]=n;if(n===organs[i].answer)state.score+=10;renderQuiz();return}
switch(a){
case "fullscreen":if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>toast('Layar penuh tidak tersedia di perangkat ini.'));break;case "home":show("home");break;case "learn":show("learn");break;case "jump":state.organ=Number(b.dataset.index);show("organ");break;case "prev":state.organ=Math.max(0,state.organ-1);show("organ");break;case "next":if(complete(state.organ)){state.organ=Math.min(5,state.organ+1);show("organ")}break;
case "repeat":stopVisual();state.steps[state.organ]={};if(state.organ===5)state.finished=false;renderOrgan();break;
case "toggleInfo":state.info=!state.info;renderOrgan();break;
case "encyclopedia":show("encyclopedia");break;case "lab":show("lab");break;case "settings":show("settings");break;
case "quiz":state.quizIndex=0;show("quiz");break;case "quizNext":if(state.quizIndex<5){state.quizIndex++;renderQuiz()}else show("quizResult");break;
case "restartQuiz":for(let i=0;i<6;i++)delete state.answered["q"+i];state.quizIndex=0;show("quiz");break;
case "react":state.labRun=true;renderLab();if(canMove())document.getElementById("lab-reaction").classList.add("reacting");break;
case "free":stopFree();state.organ=0;state.freeTick=0;state.absorbed=0;state.waste=100;state.finished=false;show("free");break;
case "play":startFree();break;case "pause":stopFree();renderFree();break;
case "freeReset":stopFree();stopVisual();state.organ=0;state.freeTick=0;state.absorbed=0;state.waste=100;state.finished=false;renderFree();break;
case "faster":state.speed=Math.min(3,state.speed+.5);renderFree();break;
case "slower":state.speed=Math.max(.5,state.speed-.5);renderFree();break;
}});
app.addEventListener("change",e=>{if(e.target.id==="organ-food"){state.food=e.target.value;state.steps[0]={};renderOrgan()}if(e.target.id==="free-food"){state.food=e.target.value;state.absorbed=0;state.waste=100;state.organ=0;state.freeTick=0;renderFree()}if(e.target.id==="enzyme-select"){state.enzyme=Number(e.target.value);state.labRun=false;renderLab()}if(e.target.id==="setting-motion"){state.settings.motion=e.target.value==="on";renderSettings()}});
app.addEventListener("input",e=>{if(e.target.id==="free-speed"){state.speed=Number(e.target.value);document.getElementById("speed-value").textContent=state.speed+"×"}});
document.addEventListener("visibilitychange",()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;lastFrame=0}else if(state.playing&&state.page==="free"){frame=requestAnimationFrame(animateFree)}syncVisual()});
reduced.addEventListener("change",syncVisual);
renderHome();
</script>
 <script src="/vexel-leaderboard.js" data-game-id="pencernaan-simulator" defer></script></body>
</html>
