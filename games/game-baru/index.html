<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ULTIMATE FIGHTER ARENA</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:Impact,'Arial Black',sans-serif;color:#fff}
#c{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;background:rgba(5,6,20,.55);text-align:center;padding:6px}
.scr.on{display:flex}
h1{margin:0;font-size:clamp(26px,10vh,70px);line-height:1;letter-spacing:3px;font-style:italic;background:linear-gradient(#fff,#ffb400 55%,#ff2d55);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #f05)}
h2{margin:0;font-size:clamp(18px,6vh,34px);letter-spacing:3px;color:#0ff}
small{font-family:Arial,sans-serif;opacity:.7;font-size:clamp(9px,2.4vh,13px)}
.btn{font:inherit;font-size:clamp(13px,3.8vh,22px);padding:.55em 1.5em;margin:2px;border:2px solid #0ff;border-radius:6px;background:linear-gradient(#123,#0a1830);color:#fff;letter-spacing:2px;box-shadow:0 0 14px #0ff8,inset 0 0 10px #0ff3;cursor:pointer;transform:skew(-8deg);touch-action:manipulation}
.btn:active{background:#0ff5}
.btn.m{border-color:#f4a;box-shadow:0 0 14px #f4a8,inset 0 0 10px #f4a3}
.row{display:flex;gap:6px;align-items:center}
.card{border:2px solid #345;border-radius:8px;background:rgba(10,20,40,.7);padding:2px 3px;display:flex;flex-direction:column;align-items:center;font-size:clamp(9px,2.6vh,13px);cursor:pointer;touch-action:manipulation}
.card canvas{height:clamp(54px,17vh,96px);width:auto}
.card.s0{border-color:#0ff;box-shadow:0 0 12px #0ff}
.card.s1{border-color:#f4a;box-shadow:0 0 12px #f4a}
.card.s0.s1{border-color:#fff}
.pl{width:24px;font-size:clamp(14px,4vh,22px)}
#info{font-family:Arial,sans-serif;font-weight:bold;font-size:clamp(10px,2.8vh,14px);line-height:1.5}
#pads{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;align-items:flex-end;padding:0 8px calc(8px + env(safe-area-inset-bottom));pointer-events:none;--b:clamp(38px,12.5vh,66px)}
#pads.on{display:flex}
.side{display:flex;gap:calc(var(--b)*.3);align-items:flex-end}
.dp{display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(2,var(--b));gap:3px}
.ku{grid-column:2;grid-row:1}.kl{grid-column:1;grid-row:2}.kd{grid-column:2;grid-row:2}.kr{grid-column:3;grid-row:2}
.sk{display:flex;gap:4px;align-items:flex-end}
.sk .k{width:calc(var(--b)*.92);height:calc(var(--b)*.92)}
.sk .k:nth-child(2){margin-bottom:calc(var(--b)*.35)}.sk .k:nth-child(3){margin-bottom:calc(var(--b)*.7)}
.k{pointer-events:auto;position:relative;border-radius:50%;border:2px solid var(--c);background:rgba(8,16,36,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.36);overflow:hidden;box-shadow:0 0 10px var(--c),inset 0 0 8px var(--c)}
.p0{--c:#0ff}.p1{--c:#f4a}
.k.dn{background:var(--c);color:#000}
.k span{position:relative;z-index:1}
.k .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.72)}
#pb{pointer-events:auto;position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(var(--b)*.8);height:calc(var(--b)*.8);border-radius:50%;border:2px solid #fff8;background:rgba(0,0,0,.5);color:#fff;font-size:calc(var(--b)*.3)}
#rot{display:none;position:absolute;inset:0;z-index:99;background:#05060f;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:20px}
@media (orientation:portrait){#rot{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div id="pads"><button id="pb">❚❚</button></div>

<div class="scr on" id="menu">
<h1>ULTIMATE<br>FIGHTER ARENA</h1>
<div><button class="btn" id="b1">MULAI PERTARUNGAN</button></div>
<div><button class="btn" id="b2">PILIH HERO</button></div>
<div><button class="btn" id="b3">PENGATURAN</button></div>
<small>Keyboard — P1: W A S D + F G H &nbsp;|&nbsp; P2: Panah + J K L &nbsp;|&nbsp; ⬇ = Bertahan (Block)</small>
</div>

<div class="scr" id="sel">
<h2>PILIH HERO</h2>
<div class="row"><b class="pl" style="color:#0ff">P1</b><div class="row" id="r0"></div></div>
<div class="row"><b class="pl" style="color:#f4a">P2</b><div class="row" id="r1"></div></div>
<div id="info"></div>
<div><button class="btn" id="go">MULAI</button><button class="btn m" id="bk">KEMBALI</button></div>
</div>

<div class="scr" id="set">
<h2>PENGATURAN</h2>
<div><button class="btn" id="o1"></button></div>
<div><button class="btn" id="o2"></button></div>
<div><button class="btn" id="o3"></button></div>
<div><button class="btn" id="o4">LAYAR PENUH</button></div>
<div><button class="btn m" id="ob">KEMBALI</button></div>
</div>

<div class="scr" id="pz"><h2>JEDA</h2>
<div><button class="btn" id="pr">LANJUT</button></div>
<div><button class="btn m" id="pm">KEMBALI KE MENU</button></div></div>

<div class="scr" id="rs"><h1 id="rt"></h1><h2 id="rsub"></h2>
<div><button class="btn" id="rm">REMATCH</button></div>
<div><button class="btn m" id="rb">KEMBALI KE MENU</button></div></div>

<div id="rot">↻<br>Putar HP ke mode LANDSCAPE<br>untuk bermain 2 pemain</div>

<script>
"use strict";
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=960,HT=540,GY=430;cv.width=W;cv.height=HT;
const $=id=>document.getElementById(id);
const keys=[{},{}],E={};
let Q=1,shakeOn=true,snd=true,paused=false,sel=[0,3];

/* ---------- AUDIO ---------- */
let AC;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function sfx(f,d=.1,type='square',v=.06,sl=0){if(!snd||!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}

/* ---------- DATA HERO ---------- */
const H=[
{n:'BLAZE',c:'#e53935',c2:'#ff9800',a:'#ffd54f',fx:'fire',spd:240,sc:1,wd:1,
 s:[{n:'Fire Blast',t:'proj',dmg:7,cd:.8,en:0,fw:.12,tt:.32,sp:560,r:13,an:'cast'},
    {n:'Flame Kick',t:'melee',dmg:12,cd:2.4,en:15,fw:.14,tt:.45,rng:105,dash:300,an:'kick',kb:300},
    {n:'Inferno Burst',t:'aoe',dmg:30,cd:9,en:50,fw:.55,tt:.95,rad:230,an:'up'}]},
{n:'THUNDER',c:'#fdd835',c2:'#1565c0',a:'#80deea',fx:'elec',spd:265,sc:1,wd:.95,
 s:[{n:'Thunder Strike',t:'melee',dmg:7,cd:.55,en:0,fw:.08,tt:.28,rng:80,dash:150,an:'punch'},
    {n:'Electric Dash',t:'melee',dmg:12,cd:2.4,en:15,fw:.08,tt:.4,rng:130,dash:620,an:'punch',kb:320},
    {n:'Lightning Storm',t:'bolt',dmg:10,cd:9,en:50,fw:.5,tt:1,an:'up'}]},
{n:'SHADOW',c:'#37474f',c2:'#7e57c2',a:'#ce93d8',fx:'dark',spd:285,sc:.97,wd:.8,
 s:[{n:'Shadow Slash',t:'melee',dmg:6,cd:.5,en:0,fw:.07,tt:.26,rng:85,dash:170,an:'punch'},
    {n:'Teleport',t:'tele',dmg:12,cd:3,en:15,fw:.15,tt:.5,an:'cast'},
    {n:'Dark Explosion',t:'aoe',dmg:28,cd:9,en:50,fw:.5,tt:.9,rad:210,an:'up'}]},
{n:'TITAN',c:'#6d4c41',c2:'#90a4ae',a:'#ffb74d',fx:'earth',spd:190,sc:1.15,wd:1.45,
 s:[{n:'Heavy Punch',t:'melee',dmg:10,cd:.85,en:0,fw:.16,tt:.45,rng:100,dash:120,an:'punch',kb:340},
    {n:'Ground Smash',t:'proj',dmg:13,cd:2.8,en:15,fw:.25,tt:.55,sp:470,r:30,hh:22,low:1,up:1,an:'up'},
    {n:'Earthquake',t:'aoe',dmg:30,cd:9,en:50,fw:.6,tt:1,rad:300,gnd:1,an:'up'}]},
{n:'FROST',c:'#4fc3f7',c2:'#e1f5fe',a:'#b3e5fc',fx:'ice',spd:245,sc:1,wd:.95,
 s:[{n:'Ice Blast',t:'proj',dmg:7,cd:.8,en:0,fw:.12,tt:.32,sp:540,r:12,an:'cast'},
    {n:'Frozen Kick',t:'melee',dmg:11,cd:2.5,en:15,fw:.14,tt:.45,rng:105,dash:280,an:'kick',frz:1},
    {n:'Blizzard Attack',t:'proj',dmg:28,cd:9,en:50,fw:.55,tt:.95,sp:400,r:75,hh:110,pierce:1,an:'cast'}]}
];
const EL={fire:{c:['#ff3d00','#ff9100','#ffd600'],g:-260,s:160,k:'c'},elec:{c:['#fff','#00e5ff','#ffee58'],g:0,s:420,k:'l'},dark:{c:['#7b1fa2','#4a148c','#e040fb'],g:-30,s:120,k:'c'},earth:{c:['#8d6e63','#a1887f','#d7ccc8','#ffb300'],g:900,s:300,k:'c'},ice:{c:['#e1f5fe','#81d4fa','#b3e5fc','#fff'],g:120,s:200,k:'c'}};

/* ---------- STATE ---------- */
let F=[],DF=[],P=[],PT=[],FX=[];
const G={st:'menu',round:1,timer:99,t:0,tm:0,shake:0,flash:0,dim:0,stop:0,msg:'',win:-1};
function mkF(p){return{p,h:H[sel[p]],x:p?740:220,y:0,vx:0,vy:0,f:p?-1:1,hp:100,hl:100,en:30,st:'idle',anim:Math.random()*5,at:null,cds:[0,0,0],pk:{},hs:0,frz:0,combo:0,ct:0,pop:0,wins:0,blk:false,inv:0}}
function refreshDemo(){DF=[mkF(0),mkF(1)];DF[0].x=300;DF[1].x=660}
function resetRound(){for(const f of F){f.x=f.p?740:220;f.y=0;f.vx=f.vy=0;f.f=f.p?-1:1;f.hp=f.hl=100;f.en=30;f.st='idle';f.at=null;f.cds=[0,0,0];f.hs=0;f.frz=0;f.combo=0;f.blk=false;f.inv=0}P.length=0;PT.length=0;FX.length=0;G.timer=99;G.st='intro';G.t=0;G.dim=0}
function clearKeys(){for(const p of[0,1])for(const k in keys[p])keys[p][k]=false;document.querySelectorAll('.k.dn').forEach(b=>b.classList.remove('dn'))}
function startMatch(){F=[mkF(0),mkF(1)];G.round=1;clearKeys();resetRound();show(null);$('pads').classList.add('on')}
function toMenu(){paused=false;G.st='menu';clearKeys();$('pads').classList.remove('on');refreshDemo();show('menu')}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}

/* ---------- PARTIKEL ---------- */
function burst(x,y,n,e,sc=1){const E1=EL[e];n=Math.ceil(n*Q);if(PT.length>360)return;for(let i=0;i<n;i++){const an=Math.random()*6.283,sp=E1.s*(.2+Math.random())*sc;PT.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-(e==='earth'?150:0),l:0,m:.35+Math.random()*.5,c:E1.c[i%E1.c.length],s:2+Math.random()*4*sc,g:E1.g,k:E1.k})}}

/* ---------- LOGIKA PERTARUNGAN ---------- */
const clampX=f=>{f.x=Math.max(50,Math.min(910,f.x))};
function startSkill(f,i){const sk=f.h.s[i];if(f.cds[i]>0||f.en<sk.en)return;f.cds[i]=sk.cd;f.en-=sk.en;f.at={i,t:0,hit:false,fired:false};f.vx=0;if(sk.t==='aoe'||sk.t==='bolt'||sk.r>40){G.dim=.5;sfx(120,.5,'sawtooth',.07,300)}}
function hit(a,d,dmg,o={}){
 if(d.hp<=0||d.inv>0)return;
 const b=d.blk,x=d.x,y=GY-d.y-70;
 const dm=dmg*(1+Math.min(a.combo,8)*.05)*(b?(o.ult?.45:.2):1);
 d.hp=Math.max(0,d.hp-dm);
 if(b){d.vx=a.f*80;burst(x,y,8,'ice',.4);sfx(220,.08,'square',.06);G.shake=Math.max(G.shake,3)}
 else{
  a.combo++;a.ct=1.5;a.pop=.3;
  d.hs=o.stun||.3;if(o.frz){d.hs=.9;d.frz=.9}
  d.vx=a.f*(o.kb||200);d.at=null;d.st='hit';
  if(o.air){d.vy=Math.max(d.vy,330);d.y=Math.max(d.y,1)}
  burst(x,y,14+dm,a.h.fx,.8);
  FX.push({k:'ring',x,y,r:5,r1:50+dm*2,t:0,m:.25,c:'#fff'});
  G.shake=Math.max(G.shake,Math.min(18,dm*.9));G.stop=Math.max(G.stop,o.ult?.12:.04);
  if(dm>=12)G.flash=Math.max(G.flash,.3);
  sfx(150+Math.random()*60,.1,'square',.09,-80);
 }
 a.en=Math.min(100,a.en+(b?3:9));d.en=Math.min(100,d.en+4);
 if(d.hp<=0){d.st='ko';d.at=null;d.vy=420;d.y=Math.max(d.y,1);d.vx=a.f*260;G.shake=22}
}
function melee(f,o,sk){const dx=(o.x-f.x)*f.f;if(dx>-15&&dx<sk.rng+22&&Math.abs(o.y-f.y)<95){f.at.hit=true;hit(f,o,sk.dmg,{kb:sk.kb||200,frz:sk.frz})}}
function fire(f,o,sk){
 const h=f.h,d=f.f,cy=GY-f.y-80,e=h.fx;
 if(sk.t==='melee'){f.vx=d*(sk.dash||0);FX.push({k:'arc',x:f.x+d*30,y:cy,d,r:sk.rng,t:0,m:.18,c:h.a});burst(f.x+d*40,cy,8,e,.6);sfx(e==='elec'?900:300,.12,'sawtooth',.05,-150)}
 else if(sk.t==='proj'){const py=sk.low?GY-20:cy;P.push({x:f.x+d*55,y:py,vx:d*sk.sp,r:sk.r,hh:sk.hh||sk.r,sk,own:f,e,hit:0});burst(f.x+d*55,py,10,e,.7);sfx(e==='fire'?200:500,.2,'triangle',.07,sk.r>40?-100:200);if(sk.low||sk.r>40)G.shake=Math.max(G.shake,8)}
 else if(sk.t==='aoe'){FX.push({k:'ring',x:f.x,y:GY-20,r:20,r1:sk.rad,t:0,m:.5,c:h.a},{k:'ring',x:f.x,y:GY-20,r:10,r1:sk.rad*.7,t:0,m:.7,c:h.c2});burst(f.x,GY-40,60,e,2);G.shake=24;G.flash=.9;G.stop=.1;G.dim=0;sfx(80,.7,'sawtooth',.12,-40);if(Math.abs(o.x-f.x)<sk.rad&&(!sk.gnd||o.y<=5))hit(f,o,sk.dmg,{kb:420,stun:.7,ult:1,air:1})}
 else if(sk.t==='tele'){burst(f.x,cy,25,e,1);const side=o.x>=f.x?1:-1;f.x=Math.max(50,Math.min(910,o.x+side*70));f.f=-side;f.inv=.2;burst(f.x,cy,25,e,1);sfx(1200,.25,'sine',.06,-900);FX.push({k:'arc',x:f.x-side*30,y:cy,d:-side,r:110,t:0,m:.2,c:h.a});if(Math.abs(o.y-f.y)<100)hit(f,o,sk.dmg,{kb:300})}
 else if(sk.t==='bolt'){G.dim=0;sfx(200,.4,'sawtooth',.08,-100);[0,-110,110].forEach((off,i)=>FX.push({k:'bolt',x:Math.max(60,Math.min(900,o.x+off)),t:-(.2+i*.3),m:.35,f,o,dmg:sk.dmg,done:0}))}
}
function upd(f,o,dt,ctl){
 const k=ctl?keys[f.p]:E,h=f.h;
 f.anim+=dt;f.ct-=dt;if(f.ct<=0)f.combo=0;f.pop-=dt;f.inv-=dt;f.frz-=dt;
 for(let i=0;i<3;i++)f.cds[i]-=dt;
 f.en=Math.min(100,f.en+5*dt);f.blk=false;
 if(f.y>0||f.vy>0){f.vy-=2100*dt;f.y+=f.vy*dt;if(f.y<=0){f.y=0;f.vy=0}}
 if(f.st==='ko'||f.st==='win'){f.vx*=Math.pow(.03,dt);f.x+=f.vx*dt;clampX(f);return}
 if(f.hs>0){f.hs-=dt;f.st='hit';f.vx*=Math.pow(.02,dt);f.at=null}
 else if(f.at){
  const sk=h.s[f.at.i],a=f.at;a.t+=dt;f.st='atk';f.vx*=Math.pow(.01,dt);
  if(!a.fired&&a.t>=sk.fw){a.fired=true;fire(f,o,sk)}
  if(sk.t==='melee'&&a.fired&&!a.hit&&a.t<sk.fw+.17)melee(f,o,sk);
  if(a.t>=sk.tt)f.at=null;
 }else{
  f.f=o.x>=f.x?1:-1;
  if(k.d&&f.y<=0){f.st='block';f.blk=true;f.vx=0}
  else{
   const mv=(k.r?1:0)-(k.l?1:0);
   f.vx=mv*h.spd*(f.y>0?.85:1);
   if(k.u&&f.y<=0){f.vy=780;f.y=1;sfx(300,.12,'sine',.05,300)}
   f.st=f.y>0?'jump':mv?'walk':'idle';
  }
  for(let i=1;i<=3;i++)if(k['s'+i]&&!f.pk['s'+i]){startSkill(f,i-1);break}
 }
 f.x+=f.vx*dt;clampX(f);
 f.pk.s1=!!k.s1;f.pk.s2=!!k.s2;f.pk.s3=!!k.s3;
}
function collide(){const a=F[0],b=F[1],dx=b.x-a.x;if(Math.abs(dx)<58&&Math.abs(a.y-b.y)<90){const s=dx>=0?1:-1,ov=(58-Math.abs(dx))/2;a.x-=s*ov;b.x+=s*ov;clampX(a);clampX(b)}}
function projs(dt){
 for(const p of P){p.x+=p.vx*dt;const o=F[1-p.own.p];
  if(!p.hit&&Math.abs(p.x-o.x)<p.r+24&&Math.abs(p.y-(GY-o.y-(o.blk?45:65)))<p.hh+55){const big=p.r>40;hit(p.own,o,p.sk.dmg,{kb:big?400:240,stun:big?.6:.3,ult:big,air:p.sk.up||big});burst(p.x,p.y,16,p.e,1);if(p.sk.pierce)p.hit=1;else p.dead=1}
  if(Math.random()<.7)burst(p.x,p.y,1,p.e,.3);
  if(p.x<-120||p.x>1080)p.dead=1}
 for(let i=P.length-1;i>=0;i--)if(P[i].dead)P.splice(i,1)}
function endRound(){
 const a=F[0].hp,b=F[1].hp;let w=-1;if(a>b)w=0;else if(b>a)w=1;
 G.win=w;G.st='end';G.t=0;G.msg=(a<=0||b<=0)?'K.O.':'WAKTU HABIS';
 if(w<0)G.msg='SERI!';
 for(const f of F){f.at=null}
 if(w>=0){F[w].wins++;F[w].st='win';F[1-w].st='ko';F[1-w].vy=Math.max(F[1-w].vy,1);if(F[1-w].y<=0&&F[1-w].hp>0){F[1-w].y=1;F[1-w].vy=250;F[1-w].vx=-F[1-w].f*150}}
 G.shake=16;G.flash=.8;sfx(110,.7,'sawtooth',.12,-60);
}
function nextRound(){
 const w=F.findIndex(f=>f.wins>=2);
 if(w>=0){G.st='over';G.win=w;$('rt').textContent='PLAYER '+(w+1)+' WIN';$('rsub').textContent=F[w].h.n+'   •   '+F[0].wins+' - '+F[1].wins;show('rs');$('pads').classList.remove('on');F[w].st='win';clearKeys();return}
 G.round++;resetRound();
}
function step(dt){
 const rd=dt;G.tm+=dt;
 if(G.stop>0){G.stop-=rd;dt=rd*.08}
 G.shake=Math.max(0,G.shake-60*rd);G.flash=Math.max(0,G.flash-2.5*rd);G.dim=Math.max(0,G.dim-.8*rd);
 const menu=G.st==='menu'||G.st==='select',L=menu?DF:F;
 if(menu)DF.forEach(f=>f.anim+=dt);
 else{
  const ctl=G.st==='fight';
  if(G.st==='intro'){G.t+=dt;if(G.t>2.1){G.st='fight';sfx(500,.3,'sawtooth',.08,400)}}
  if(ctl)G.timer-=dt;
  upd(F[0],F[1],dt,ctl);upd(F[1],F[0],dt,ctl);collide();projs(dt);
  for(const f of F)f.hl=Math.max(f.hp,f.hl-30*rd);
