      /* -----------------------------------------------------------------------
         GAME LOOP TERPISAH: UPDATE -> ANIMATION -> MAP -> OBJECTS -> UI
         ----------------------------------------------------------------------- */
      loop(timestamp) {
        if (!this.lastFrameTime) this.lastFrameTime = timestamp;
        const rawDt = (timestamp - this.lastFrameTime) / 1000;
        const dt = clamp(rawDt, 0, 0.05);
        this.lastFrameTime = timestamp;

        if (!this.isPaused && !this.gameOver) {
          this.updateGame(dt);
          this.updateAnimations(dt);
        }

        this.renderMap();
        this.renderObjects();
        this.renderUI();

        requestAnimationFrame((ts) => this.loop(ts));
      }

      updateGame(dt) {
        this.enemyAI.update(dt);

        // Update bangunan
        for (let i = 0; i < this.world.buildings.length; i++) {
          this.world.buildings[i].update(dt, this.world, this);
        }

        // Update warga
        for (let i = 0; i < this.world.workers.length; i++) {
          this.world.workers[i].update(dt, this.world, this);
        }

        // Update pasukan
        for (let i = 0; i < this.world.soldiers.length; i++) {
          this.world.soldiers[i].update(dt, this.world, this);
        }

        // Update riset Pandai Besi
        if (this.activeResearch) {
          const ar = this.activeResearch;
          if (!ar.building || ar.building.hp <= 0) {
            this.activeResearch = null;
          } else {
            ar.timer += dt;
            if (ar.timer >= ar.duration) {
              const spec = TECH_UPGRADES[ar.techId];
              this.playerTech[ar.techId] = Math.min(spec.maxLevel, (this.playerTech[ar.techId] || 0) + 1);
              this.activeResearch = null;
              this.sound.horn();
              this.showToast(`Riset Selesai: ${spec.name} Lv.${this.playerTech[ar.techId]}!`);
              this.updateSelectionPanel();
            }
          }
        }

        // Update proyektil panah & bola meriam
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          if (p.target && p.target.hp > 0) {
            p.tx = p.target.x;
            p.ty = p.target.y - 8;
          }
          const dx = p.tx - p.x;
          const dy = p.ty - p.y;
          const dist = Math.hypot(dx, dy);
          const step = p.speed * dt;

          if (dist <= step + 4) {
            if (p.splashRadius > 0) {
              const enemyTeam = p.team === "player" ? "enemy" : "player";
              for (const s of this.world.soldiers) {
                if (s.team === enemyTeam && Math.hypot(s.x - p.tx, s.y - p.ty) <= p.splashRadius) {
                  this.applyDamage(s, p.damage, null);
                }
              }
              for (const b of this.world.buildings) {
                if (b.team === enemyTeam && distanceToEntityEdge(b, p.tx, p.ty) <= p.splashRadius) {
                  this.applyDamage(b, p.damage, null);
                }
              }
              for (let k = 0; k < 10; k++) {
                const ang = (k / 10) * Math.PI * 2;
                this.particles.push({
                  x: p.tx,
                  y: p.ty,
                  vx: Math.cos(ang) * 55,
                  vy: Math.sin(ang) * 55,
                  life: 0.35,
                  maxLife: 0.35,
                  size: 3,
                  color: k % 2 === 0 ? "#f97316" : "#fde047"
                });
              }
            } else if (p.target && p.target.hp > 0) {
              this.applyDamage(p.target, p.damage, null);
            }
            this.projectiles.splice(i, 1);
          } else {
            p.x += (dx / dist) * step;
            p.y += (dy / dist) * step;
          }
        }

        // Update partikel visual & getaran sumber daya
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const pt = this.particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.life -= dt;
          if (pt.life <= 0) this.particles.splice(i, 1);
        }

        for (let i = 0; i < this.world.staticProps.length; i++) {
          const pr = this.world.staticProps[i];
          if (pr.shakeTimer > 0) pr.shakeTimer = Math.max(0, pr.shakeTimer - dt);
        }

        if (this.alertPing) {
          this.alertPing.timer -= dt;
          if (this.alertPing.timer <= 0) {
            this.alertPing = null;
            document.getElementById("btnAlertJump").style.display = "none";
          }
        }

        // Refresh berkala badge HUD & panel status
        this.uiRefreshTimer += dt;
        if (this.uiRefreshTimer >= 0.3) {
          this.uiRefreshTimer = 0;
          const idleCount = this.world.workers.filter((w) => w.team === "player" && w.hp > 0 && w.status === "Idle").length;
          const armyCount = this.world.soldiers.filter((s) => s.team === "player" && s.hp > 0).length;
          document.getElementById("idleWorkerBadge").textContent = String(idleCount);
          document.getElementById("armyCountBadge").textContent = String(armyCount);
          document.getElementById("enemyStatusHud").textContent = this.enemyAI.statusLabel;

          if (this.selectedEntities.length === 1) {
            const sel = this.selectedEntities[0];
            if (sel.hp <= 0) {
              this.updateSelectionPanel();
            } else if (!sel.resourceType) {
              document.getElementById("selStats").textContent = `HP: ${Math.ceil(sel.hp)}/${sel.maxHp}`;
              document.getElementById("selStatus").textContent = `Status: ${sel.status}`;
            }
          }
        }
      }

      updateAnimations(dt) {
        this.globalTime += dt;
        this.waterFrame = Math.floor(this.globalTime * 1.6) % 2;
        this.flagFrame = Math.floor(this.globalTime * 2.8) % 2;
      }

      isPointOnScreen(wx, wy) {
        const margin = 96;
        const left = this.camera.x - margin;
        const right = this.camera.x + this.canvas.width / this.camera.zoom + margin;
        const top = this.camera.y - margin;
        const bottom = this.camera.y + this.canvas.height / this.camera.zoom + margin;
        return wx >= left && wx <= right && wy >= top && wy <= bottom;
      }

      renderMap() {
        const ctx = this.ctx;
        ctx.save();
        ctx.fillStyle = "#141a12";
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        ctx.scale(this.camera.zoom, this.camera.zoom);
        ctx.translate(-Math.floor(this.camera.x), -Math.floor(this.camera.y));

        const chunkPx = CONFIG.CHUNK_TILES * 32;
        const chunksPerSide = CONFIG.MAP_COLS / CONFIG.CHUNK_TILES;
        const viewLeft = this.camera.x;
        const viewTop = this.camera.y;
        const viewRight = viewLeft + this.canvas.width / this.camera.zoom;
        const viewBottom = viewTop + this.canvas.height / this.camera.zoom;

        const minCC = clamp(Math.floor(viewLeft / chunkPx), 0, chunksPerSide - 1);
        const maxCC = clamp(Math.floor(viewRight / chunkPx), 0, chunksPerSide - 1);
        const minCR = clamp(Math.floor(viewTop / chunkPx), 0, chunksPerSide - 1);
        const maxCR = clamp(Math.floor(viewBottom / chunkPx), 0, chunksPerSide - 1);

        // Gambar chunk tanah & rumput yang terlihat kamera (Viewport Culling)
        for (let cr = minCR; cr <= maxCR; cr++) {
          for (let cc = minCC; cc <= maxCC; cc++) {
            const cCanvas = this.world.chunkCanvases[cr * chunksPerSide + cc];
            if (cCanvas) ctx.drawImage(cCanvas, cc * chunkPx, cr * chunkPx);
          }
        }

        // Gambar tile sungai beranimasi pada area kamera
        const minTileC = clamp(Math.floor(viewLeft / 32), 0, CONFIG.MAP_COLS - 1);
        const maxTileC = clamp(Math.floor(viewRight / 32), 0, CONFIG.MAP_COLS - 1);
        const minTileR = clamp(Math.floor(viewTop / 32), 0, CONFIG.MAP_ROWS - 1);
        const maxTileR = clamp(Math.floor(viewBottom / 32), 0, CONFIG.MAP_ROWS - 1);
        const waterImg = this.baker.waterTiles[this.waterFrame];

        for (let r = minTileR; r <= maxTileR; r++) {
          for (let c = minTileC; c <= maxTileC; c++) {
            if (this.world.tiles[this.world.idx(c, r)] === 2) {
              ctx.drawImage(waterImg, c * 32, r * 32);
            }
          }
        }

        ctx.restore();
      }

      renderObjects() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.camera.zoom, this.camera.zoom);
        ctx.translate(-Math.floor(this.camera.x), -Math.floor(this.camera.y));

        // Hitung batas viewport sekali saja, bukan untuk setiap objek.
        const viewLeft = this.camera.x - 96;
        const viewRight = this.camera.x + this.canvas.width / this.camera.zoom + 96;
        const viewTop = this.camera.y - 96;
        const viewBottom = this.camera.y + this.canvas.height / this.camera.zoom + 96;
        const isVisible = (obj) =>
          obj.x >= viewLeft && obj.x <= viewRight &&
          obj.y >= viewTop && obj.y <= viewBottom;

        // Kumpulkan entitas yang terlihat untuk Y-sorting.
        const visible = [];
        for (let i = 0; i < this.world.staticProps.length; i++) {
          const p = this.world.staticProps[i];
          if (isVisible(p)) visible.push(p);
        }
        for (let i = 0; i < this.world.buildings.length; i++) {
          const b = this.world.buildings[i];
          if (b.hp > 0 && isVisible(b)) visible.push(b);
        }
        for (let i = 0; i < this.world.workers.length; i++) {
          const w = this.world.workers[i];
          if (w.hp > 0 && isVisible(w)) visible.push(w);
        }
        for (let i = 0; i < this.world.soldiers.length; i++) {
          const s = this.world.soldiers[i];
          if (s.hp > 0 && isVisible(s)) visible.push(s);
        }

        visible.sort((a, b) => a.y - b.y);

        // Lingkaran seleksi di bawah entitas yang dipilih
        for (let i = 0; i < this.selectedEntities.length; i++) {
          const sel = this.selectedEntities[i];
          if (!sel || sel.hp <= 0 || !isVisible(sel)) continue;
          const rx = sel.type === "building" ? sel.tileW * 16 : 12;
          const ry = sel.type === "building" ? sel.tileH * 11 : 7;
          ctx.strokeStyle = sel.team === "enemy" ? "#ef4444" : "#4ade80";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(sel.x, sel.y + 4, rx, ry, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Render masing-masing entitas
        for (let i = 0; i < visible.length; i++) {
          const ent = visible[i];
          const shake = ent.shakeTimer > 0 ? Math.sin(this.globalTime * 60) * 2 : 0;

          if (ent.type === "tree") {
            const img = this.baker.trees[ent.variant] || this.baker.trees[0];
            ctx.drawImage(img, Math.round(ent.x - 16 + shake), Math.round(ent.y - 38));
            this.drawResourceBar(ctx, ent);
          } else if (ent.type === "rock") {
            ctx.drawImage(this.baker.rocks[0], Math.round(ent.x - 16 + shake), Math.round(ent.y - 22));
            this.drawResourceBar(ctx, ent);
          } else if (ent.type === "gold") {
            ctx.drawImage(this.baker.golds[0], Math.round(ent.x - 16 + shake), Math.round(ent.y - 22));
            this.drawResourceBar(ctx, ent);
          } else if (ent.type === "stump") {
            ctx.drawImage(this.baker.stumpSprite, Math.round(ent.x - 12), Math.round(ent.y - 12));
          } else if (ent.type === "rubble") {
            ctx.drawImage(this.baker.rubbleSprite, Math.round(ent.x - 12), Math.round(ent.y - 12));
          } else if (ent.type === "bush") {
            ctx.drawImage(this.baker.bushes[0], Math.round(ent.x - 10), Math.round(ent.y - 12));
          } else if (ent.type === "flower") {
            ctx.drawImage(this.baker.flowers[ent.variant % 3], Math.round(ent.x - 8), Math.round(ent.y - 8));
          } else if (ent.type === "building") {
            this.renderBuilding(ctx, ent);
          } else if (ent.type === "worker" || ent.type === "soldier") {
            this.renderUnit(ctx, ent);
          }
        }

        // Proyektil
        for (let i = 0; i < this.projectiles.length; i++) {
          const p = this.projectiles[i];
          if (p.kind === "cannonball") {
            ctx.fillStyle = "#111827";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#f97316";
            ctx.fillRect(p.x - 1, p.y - 5, 2, 2);
          } else {
            const ang = Math.atan2(p.ty - p.y, p.tx - p.x);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(ang);
            ctx.fillStyle = "#fef08a";
            ctx.fillRect(-6, -1, 12, 2);
            ctx.restore();
          }
        }

        // Partikel
        for (let i = 0; i < this.particles.length; i++) {
          const pt = this.particles[i];
          ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
          ctx.fillStyle = pt.color;
          ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size);
        }
        ctx.globalAlpha = 1;

        // Preview Penempatan Bangunan
        if (this.buildMode.active) {
          const spec = CONFIG.BUILDINGS[this.buildMode.subtype];
          const w = spec.tileW * 32;
          const h = spec.tileH * 32;
          ctx.fillStyle = this.buildMode.valid ? "rgba(34, 197, 94, 0.35)" : "rgba(239, 68, 68, 0.42)";
          ctx.strokeStyle = this.buildMode.valid ? "#4ade80" : "#f87171";
          ctx.lineWidth = 2;
          ctx.fillRect(this.buildMode.worldX - w / 2, this.buildMode.worldY - h / 2, w, h);
          ctx.strokeRect(this.buildMode.worldX - w / 2, this.buildMode.worldY - h / 2, w, h);
        }

        ctx.restore();
      }

      drawResourceBar(ctx, prop) {
        if (prop.amount >= prop.maxAmount || prop.amount <= 0) return;
        const w = 22;
        const x = Math.round(prop.x - 11);
        const y = Math.round(prop.y - 32);
        ctx.fillStyle = "#1a110a";
        ctx.fillRect(x - 1, y - 1, w + 2, 5);
        ctx.fillStyle = "#fde047";
        ctx.fillRect(x, y, Math.max(1, Math.round(w * (prop.amount / prop.maxAmount))), 3);
      }

      renderBuilding(ctx, b) {
        ctx.globalAlpha = b.isConstructed ? 1 : 0.68;
        const tm = b.team;
        if (b.subtype === "towncenter") {
          ctx.drawImage(this.baker.townCenterFrames[tm][this.flagFrame], Math.round(b.x - 48), Math.round(b.y - 68));
        } else if (b.subtype === "house") {
          ctx.drawImage(this.baker.houses[tm], Math.round(b.x - 24), Math.round(b.y - 34));
        } else if (b.subtype === "farm") {
          ctx.drawImage(this.baker.farmFrames[b.farmStage], Math.round(b.x - 32), Math.round(b.y - 32));
        } else if (b.subtype === "tower") {
          ctx.drawImage(this.baker.towers[tm], Math.round(b.x - 20), Math.round(b.y - 48));
        } else if (b.subtype === "barracks") {
          ctx.drawImage(this.baker.barracksFrames[tm][this.flagFrame], Math.round(b.x - 40), Math.round(b.y - 50));
        } else if (b.subtype === "blacksmith") {
          ctx.drawImage(this.baker.blacksmithFrames[tm][this.flagFrame], Math.round(b.x - 32), Math.round(b.y - 44));
        } else if (b.subtype === "wall") {
          ctx.drawImage(this.baker.wallSprites[tm], Math.round(b.x - 16), Math.round(b.y - 24));
        }
        ctx.globalAlpha = 1;

        if (!b.isConstructed || b.hp < b.maxHp) {
          const bw = b.tileW * 22;
          const bx = Math.round(b.x - bw / 2);
          const by = Math.round(b.y - b.tileH * 18 - 10);
          ctx.fillStyle = "#140d08";
          ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
          ctx.fillStyle = b.isConstructed ? (b.team === "player" ? "#22c55e" : "#ef4444") : "#f59e0b";
          const ratio = b.isConstructed ? b.hp / b.maxHp : b.buildProgress;
          ctx.fillRect(bx, by, Math.max(1, Math.round(bw * ratio)), 4);
        }
      }

      renderUnit(ctx, u) {
        const frames = this.baker.unitSprites[u.team][u.subtype];
        const img = frames[u.animFrame % frames.length];
        ctx.save();
        ctx.translate(Math.round(u.x), Math.round(u.y));
        if (u.facingLeft) ctx.scale(-1, 1);
        ctx.drawImage(img, Math.round(-img.width / 2), Math.round(-img.height + 5));
        ctx.restore();

        // Indikator bawaan sumber daya pada warga
        if (u.type === "worker" && u.carryAmount > 0) {
          ctx.fillStyle = u.carryType === "wood" ? "#92400e" : u.carryType === "food" ? "#eab308" : u.carryType === "gold" ? "#fde047" : "#9ca3af";
          ctx.fillRect(Math.round(u.x - 3), Math.round(u.y - 23), 6, 4);
        }

        // HP bar jika terluka
        if (u.hp < u.maxHp) {
          const bw = 20;
          const bx = Math.round(u.x - 10);
          const by = Math.round(u.y - 26);
          ctx.fillStyle = "#140d08";
          ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
          ctx.fillStyle = u.team === "player" ? "#22c55e" : "#ef4444";
          ctx.fillRect(bx, by, Math.max(1, Math.round(bw * (u.hp / u.maxHp))), 3);
        }
      }

      renderUI() {
        // 1. Kotak Seleksi Drag
        if (this.isSelectingBox) {
          const ctx = this.ctx;
          const x = Math.min(this.dragStartScreen.x, this.dragCurrentScreen.x);
          const y = Math.min(this.dragStartScreen.y, this.dragCurrentScreen.y);
          const w = Math.abs(this.dragCurrentScreen.x - this.dragStartScreen.x);
          const h = Math.abs(this.dragCurrentScreen.y - this.dragStartScreen.y);
          ctx.fillStyle = "rgba(74, 222, 128, 0.18)";
          ctx.strokeStyle = "#4ade80";
          ctx.lineWidth = 1.5;
          ctx.fillRect(x, y, w, h);
          ctx.strokeRect(x, y, w, h);
        }

        // 2. Minimap: pembaruan dibatasi setiap 6 frame agar tidak membebani
        // proses render utama. Frame pertama setelah dunia dibuat tetap langsung digambar.
        this.minimapFrameCounter++;
        if (this.minimapFrameCounter >= 6) {
          this.minimapFrameCounter = 0;
          const mctx = this.minimapCtx;
          mctx.imageSmoothingEnabled = false;
          mctx.drawImage(this.world.minimapBase, 0, 0);

          for (const b of this.world.buildings) {
            if (b.hp <= 0) continue;
            mctx.fillStyle = b.team === "player" ? "#3b82f6" : "#ef4444";
            mctx.fillRect(Math.floor(b.x / 32) - 1, Math.floor(b.y / 32) - 1, 3, 3);
          }

          for (const w of this.world.workers) {
            if (w.hp <= 0) continue;
            mctx.fillStyle = w.team === "player" ? "#93c5fd" : "#fca5a5";
            mctx.fillRect(Math.floor(w.x / 32), Math.floor(w.y / 32), 2, 2);
          }

          for (const s of this.world.soldiers) {
            if (s.hp <= 0) continue;
            mctx.fillStyle = s.team === "player" ? "#60a5fa" : "#f87171";
            mctx.fillRect(Math.floor(s.x / 32), Math.floor(s.y / 32), 2, 2);
          }

          // Alert ping dan viewport kamera ikut diperbarui bersama minimap.
          if (this.alertPing) {
            const px = Math.floor(this.alertPing.x / 32);
            const py = Math.floor(this.alertPing.y / 32);
            const rad = 4 + Math.sin(this.globalTime * 10) * 3;
            mctx.strokeStyle = "#fef08a";
            mctx.lineWidth = 1.5;
            mctx.beginPath();
            mctx.arc(px, py, rad, 0, Math.PI * 2);
            mctx.stroke();
          }

          const vx = this.camera.x / 32;
          const vy = this.camera.y / 32;
          const vw = (this.canvas.width / this.camera.zoom) / 32;
          const vh = (this.canvas.height / this.camera.zoom) / 32;
          mctx.strokeStyle = "#ffffff";
          mctx.lineWidth = 1;
          mctx.strokeRect(vx, vy, vw, vh);
        }
      }
    }

    // Jalankan game saat halaman selesai dimuat
    window.addEventListener("load", () => {
      window.kingdomWarGame = new KingdomWarGame();
    });
  </script>
