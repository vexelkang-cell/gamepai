        const blacksmiths = enemyBuildings.filter((b) => b.subtype === "blacksmith" && b.isConstructed);
        const walls = enemyBuildings.filter((b) => b.subtype === "wall");

        this.assessBattlefield(world, etc, enemyBuildings);
        this.assignWorkers(world, enemyWorkers, enemyBuildings, farms);

        // Target warga berkembang seiring gelombang permainan.
        // Ekonomi awal: 8 pekerja, lalu bertambah 2 pekerja setiap 2 gelombang,
        // hingga maksimal 16. Saat diserang, AI sedikit mengurangi prioritas
        // ekspansi warga agar kapasitas populasi tetap tersedia untuk pasukan.
        const growthWorkerTarget = Math.min(
          16,
          8 + Math.floor(Math.max(0, this.waveNumber - 1) / 2) * 2
        );
        const workerTarget = Math.max(
          8,
          growthWorkerTarget - (this.strategyMode === "defense" ? 2 : 0)
        );

        if (
          enemyWorkers.length < workerTarget &&
          etc.trainQueue.length === 0 &&
          this.resources.popCurrent < this.resources.popMax &&
          this.canAfford(CONFIG.UNITS.worker.cost)
        ) {
          this.spend(CONFIG.UNITS.worker.cost);
          this.resources.popCurrent += 1;
          etc.enqueueUnit("worker", CONFIG.UNITS.worker.trainTime);
        }

        // Bangun infrastruktur & pertahanan
        const unfinished = enemyBuildings.find((b) => !b.isConstructed);
        if (!unfinished && enemyWorkers.length > 0) {
          this.planAndConstruct(etc, enemyWorkers, farms, houses, barracks, towers, blacksmiths, walls);
        }

        if (blacksmiths.length > 0) {
          this.researchUpgrades();
        }

        this.trainArmy(barracks, enemySoldiers);
        this.commandArmy(world, etc, enemyBuildings, enemySoldiers, barracks);
      }

      assessBattlefield(world, etc, enemyBuildings) {
        const intel = { swordsman: 0, archer: 0, cannon: 0, workers: 0, nearbyArmy: 0 };
        for (const unit of world.soldiers) {
          if (unit.team !== "player" || unit.hp <= 0) continue;
          intel[unit.subtype] = (intel[unit.subtype] || 0) + 1;
          if (Math.hypot(unit.x - etc.x, unit.y - etc.y) <= 620) intel.nearbyArmy++;
        }
        for (const worker of world.workers) {
          if (worker.team === "player" && worker.hp > 0) intel.workers++;
        }
        this.playerIntel = intel;

        const damagedBuildings = enemyBuildings.filter((building) =>
          building.isConstructed && building.hp < building.maxHp * 0.72
        ).length;
        const pressure = intel.nearbyArmy + damagedBuildings * 2;
        this.threatLevel = Math.min(5, pressure);
        this.aggressionMemory = pressure > 0
          ? Math.min(8, this.aggressionMemory + 1)
          : Math.max(0, this.aggressionMemory - 0.35);

        const playerArmy = intel.swordsman + intel.archer + intel.cannon;
        const desiredArmy = Math.min(8, 3 + this.waveNumber);
        let nextMode = "economy";
        if (pressure >= 2 || this.aggressionMemory >= 3) nextMode = "defense";
        else if (playerArmy >= desiredArmy && this.resources.food >= 100) nextMode = "assault";
        else if (enemyBuildings.length < 7 || this.resources.wood < 180) nextMode = "expansion";

        if (nextMode !== this.strategyMode) {
          this.strategyMode = nextMode;
          this.lastStrategyChange = this.waveTimer;
        }
      }

      selectStrategicTarget(soldier, world, playerTownCenter) {
        if (soldier.subtype === "cannon") {
          return this.game.findNearestEnemyBuilding(soldier.x, soldier.y, "enemy") || playerTownCenter;
        }
        const defending = this.strategyMode === "defense" || this.threatLevel > 0;
        let best = null;
        let bestScore = Infinity;
        for (const unit of [...world.soldiers, ...world.workers]) {
          if (unit.team !== "player" || unit.hp <= 0) continue;
          const dist = Math.hypot(unit.x - soldier.x, unit.y - soldier.y);
          const isWorker = unit.type === "worker";
          const roleBias = defending
            ? (isWorker ? 110 : -150)
            : (isWorker ? -115 : 35);
          const score = dist + roleBias;
          if (score < bestScore) {
            bestScore = score;
            best = unit;
          }
        }
        return best || this.game.findNearestEnemyBuilding(soldier.x, soldier.y, "enemy") || playerTownCenter;
      }

      researchUpgrades() {
        const order = ["gather", "swordsman", "archer", "cannon"];
        for (const techId of order) {
          const lv = this.tech[techId] || 0;
          const spec = TECH_UPGRADES[techId];
          if (lv >= spec.maxLevel) continue;
          const cost = this.game.getTechUpgradeCost(techId, lv);
          if (this.canAfford(cost)) {
            this.spend(cost);
            this.tech[techId] = lv + 1;
            break;
          }
        }
      }

      assignWorkers(world, enemyWorkers, enemyBuildings, farms) {
        const unfinished = enemyBuildings.find((b) => !b.isConstructed);
        const damaged = enemyBuildings.find((b) => b.isConstructed && b.hp < b.maxHp * 0.8);
        const priorityProject = unfinished || damaged;
        const buildersNeeded = priorityProject ? (unfinished ? 3 : 2) : 0;
        let builders = enemyWorkers.filter((w) => w.taskTarget === priorityProject).length;

        if (priorityProject) {
          for (const w of enemyWorkers) {
            if (builders >= buildersNeeded) break;
            if (w.status === "Menyetor" || w.taskTarget === priorityProject) continue;
            if (w.status === "Idle" || !w.taskTarget || w.taskTarget.type !== "building") {
              w.commandInteract(priorityProject, world);
              builders++;
            }
          }
        }

        // Hitung pekerja aktif pada tiap sektor agar distribusi bahan baku selalu seimbang.
        const counts = { food: 0, wood: 0, stone: 0, gold: 0 };
        for (const w of enemyWorkers) {
          if (w === undefined || w.taskTarget === priorityProject) continue;
          const t = w.taskTarget;
          if (!t) continue;
          if (t.subtype === "farm") counts.food++;
          else if (t.resourceType && counts[t.resourceType] !== undefined) counts[t.resourceType]++;
        }

        const readyFarms = farms.filter((f) => f.isConstructed);
        const workerCount = enemyWorkers.length;
        const goals = {
          food: this.resources.food < 220 ? Math.max(3, Math.ceil(workerCount * 0.38)) : 2,
          wood: this.resources.wood < 260 ? Math.max(3, Math.ceil(workerCount * 0.34)) : 2,
          gold: this.resources.gold < 150 ? 2 : 1,
          stone: this.resources.stone < 150 ? 2 : 1
        };

        for (const w of enemyWorkers) {
          if (w.status !== "Idle" || w.taskTarget === priorityProject) continue;
          const options = ["food", "wood", "gold", "stone"].map((type) => {
            const amount = this.resources[type];
            const target = goals[type];
            // Defisit terbesar mendapat pekerja berikutnya; stok tinggi mengurangi prioritas.
            const urgency = (target - counts[type]) * 100 + Math.max(0, 320 - amount) * 0.22;
            return { type, urgency };
          }).sort((a, b) => b.urgency - a.urgency);

          let assigned = false;
          for (const option of options) {
            const type = option.type;
            if (type === "food") {
              if (!readyFarms.length) continue;
              const farm = readyFarms.reduce((best, f) => {
                const assignedTo = enemyWorkers.filter((u) => u.hp > 0 && u.taskTarget === f).length;
                const bestAssigned = best ? enemyWorkers.filter((u) => u.hp > 0 && u.taskTarget === best).length : Infinity;
                if (assignedTo >= 2) return best;
                return assignedTo < bestAssigned ? f : best;
              }, null);
              if (farm && w.commandInteract(farm, world)) {
                counts.food++;
                assigned = true;
                break;
              }
            } else {
              const node = world.findNearestResource(w.x, w.y, type, 1800);
              if (node) {
                w.commandInteract(node, world);
                counts[type]++;
                assigned = true;
                break;
              }
            }
          }

          // Jika sektor utama kehabisan titik sumber, pekerja tidak dibiarkan diam.
          if (!assigned) {
            const fallback = world.findNearestResource(w.x, w.y, "wood", 1800) ||
              world.findNearestResource(w.x, w.y, "food", 1800) ||
              world.findNearestResource(w.x, w.y, "stone", 1800) ||
              world.findNearestResource(w.x, w.y, "gold", 1800);
            if (fallback) {
              w.commandInteract(fallback, world);
              if (fallback.resourceType) counts[fallback.resourceType]++;
            }
          }
        }
      }

      planAndConstruct(etc, enemyWorkers, farms, houses, barracks, towers, blacksmiths, walls) {
        const builder = enemyWorkers.find((w) => w.status !== "Menyetor") || enemyWorkers[0];
        if (!builder) return;

        const ptc = this.game.world.playerTownCenter;
        const dirX = ptc ? Math.sign(ptc.x - etc.x) || -1 : -1;
        const dirY = ptc ? Math.sign(ptc.y - etc.y) || 1 : 1;

        if (this.resources.popMax - this.resources.popCurrent <= 4 && houses.length < 6 && this.canAfford(CONFIG.BUILDINGS.house.cost)) {
          this.tryBuildSmart(etc.x - dirX * 90, etc.y - dirY * 90, "house", builder, 80, 260);
          return;
        }
        if (farms.length < 1 && this.canAfford(CONFIG.BUILDINGS.farm.cost)) {
          this.tryBuildSmart(etc.x, etc.y, "farm", builder, 96, 240);
          return;
        }
        if (barracks.length < 1 && this.canAfford(CONFIG.BUILDINGS.barracks.cost)) {
          this.tryBuildSmart(etc.x + dirX * 130, etc.y + dirY * 130, "barracks", builder, 64, 260);
          return;
        }
        if (towers.length < 1 && this.canAfford(CONFIG.BUILDINGS.tower.cost)) {
          this.tryBuildSmart(etc.x + dirX * 210, etc.y + dirY * 210, "tower", builder, 48, 240);
          return;
        }
        if (this.threatLevel >= 2 && towers.length < 3 && this.canAfford(CONFIG.BUILDINGS.tower.cost)) {
          this.tryBuildSmart(etc.x + dirX * (220 + towers.length * 70), etc.y + dirY * 170, "tower", builder, 32, 210);
          return;
        }
        if (blacksmiths.length < 1 && this.canAfford(CONFIG.BUILDINGS.blacksmith.cost)) {
          this.tryBuildSmart(etc.x - dirX * 70, etc.y + dirY * 110, "blacksmith", builder, 64, 250);
          return;
        }
        if (walls.length < 4 && towers.length >= 1 && this.canAfford(CONFIG.BUILDINGS.wall.cost)) {
          const anchorX = etc.x + dirX * 235 + (walls.length - 1.5) * 36;
          const anchorY = etc.y + dirY * 235 - (walls.length - 1.5) * 36;
          this.tryBuildSmart(anchorX, anchorY, "wall", builder, 0, 120);
          return;
        }
        if (farms.length < 3 && this.canAfford(CONFIG.BUILDINGS.farm.cost)) {
          this.tryBuildSmart(etc.x, etc.y, "farm", builder, 110, 300);
        } else if (barracks.length < 2 && this.canAfford(CONFIG.BUILDINGS.barracks.cost)) {
          this.tryBuildSmart(etc.x + dirX * 150, etc.y + dirY * 150, "barracks", builder, 80, 300);
        } else if (towers.length < 3 && this.canAfford(CONFIG.BUILDINGS.tower.cost)) {
          this.tryBuildSmart(etc.x + dirX * 230, etc.y + dirY * 180, "tower", builder, 32, 220);
        }
      }

      isStrategicBuildSpot(world, subtype, x, y) {
        const spec = CONFIG.BUILDINGS[subtype];
        if (!spec || !world.canPlaceBuilding(subtype, x, y)) return false;
        const halfW = spec.tileW * 16, halfH = spec.tileH * 16;
        const left = x - halfW, right = x + halfW, top = y - halfH, bottom = y + halfH;

        // Beri jarak antargedung agar warga dan pasukan punya ruang bermanuver.
        for (const b of world.buildings) {
          if (b.hp <= 0) continue;
          const gapX = Math.max(0, Math.max(b.x - b.tileW * 16 - right, left - (b.x + b.tileW * 16)));
          const gapY = Math.max(0, Math.max(b.y - b.tileH * 16 - bottom, top - (b.y + b.tileH * 16)));
          if (Math.hypot(gapX, gapY) < 48) return false;
        }

        const tc = world.getTownCenter("enemy");
        if (!tc) return true;
        const playerTC = world.playerTownCenter;
        const corridors = [];
        const addCorridor = (ex, ey, width) => corridors.push({ ax: tc.x, ay: tc.y, bx: ex, by: ey, width });
        if (playerTC) addCorridor(playerTC.x, playerTC.y, 92);
        addCorridor(tc.x, 0, 76);
        addCorridor(tc.x, CONFIG.WORLD_HEIGHT, 76);
        addCorridor(0, tc.y, 76);
        addCorridor(CONFIG.WORLD_WIDTH, tc.y, 76);

        for (const route of corridors) {
          const vx = route.bx - route.ax, vy = route.by - route.ay;
          const len2 = vx * vx + vy * vy || 1;
          const t = clamp(((x - route.ax) * vx + (y - route.ay) * vy) / len2, 0, 1);
          const px = route.ax + t * vx, py = route.ay + t * vy;
          const dx = Math.max(0, Math.abs(x - px) - halfW);
          const dy = Math.max(0, Math.abs(y - py) - halfH);
          if (Math.hypot(dx, dy) < route.width) return false;
        }

        const accessPoints = [
          { x, y: top - 48 }, { x, y: bottom + 48 },
          { x: left - 48, y }, { x: right + 48, y }
        ];
        let reachableSides = 0;
        for (const p of accessPoints) {
          if (world.findPath(tc.x, tc.y, p.x, p.y).length > 0) reachableSides++;
        }
        return reachableSides >= 2;
      }

      tryBuildSmart(anchorX, anchorY, subtype, builder, minRadius = 64, maxRadius = 260) {
        const world = this.game.world;
        const spec = CONFIG.BUILDINGS[subtype];
        if (!spec || !this.canAfford(spec.cost)) return false;
        let best = null, bestScore = Infinity;
        const halfW = spec.tileW * 16, halfH = spec.tileH * 16;

        for (let rad = minRadius; rad <= maxRadius; rad += 32) {
          const steps = rad === 0 ? 1 : 16;
          for (let s = 0; s < steps; s++) {
            const ang = (s / steps) * Math.PI * 2;
            const rawX = anchorX + Math.cos(ang) * rad;
            const rawY = anchorY + Math.sin(ang) * rad;
            const gx = Math.floor(rawX / 32) * 32 + (spec.tileW % 2 === 1 ? 16 : 0);
            const gy = Math.floor(rawY / 32) * 32 + (spec.tileH % 2 === 1 ? 16 : 0);
            if (!this.isStrategicBuildSpot(world, subtype, gx, gy)) continue;

            let crowding = 0;
            for (const b of world.buildings) {
              if (b.hp <= 0) continue;
              const edgeX = Math.max(0, Math.abs(gx - b.x) - halfW - b.tileW * 16);
              const edgeY = Math.max(0, Math.abs(gy - b.y) - halfH - b.tileH * 16);
              const edge = Math.hypot(edgeX, edgeY);
              if (edge < 150) crowding += (150 - edge) * 0.35;
            }
            const score = Math.hypot(gx - anchorX, gy - anchorY) + crowding;
            if (score < bestScore) { bestScore = score; best = { x: gx, y: gy }; }
          }
        }

        if (!best) return false;
        this.spend(spec.cost);
        const b = new Building(subtype, "enemy", best.x, best.y, false);
        world.buildings.push(b);
        world.rebuildNavGrid();
        world.bakeMinimapBase();
        builder.commandInteract(b, world);
        return true;
      }

      trainArmy(barracks, enemySoldiers) {
        if (this.resources.popCurrent >= this.resources.popMax) return;
        const readyBarracks = barracks.filter((b) => b.isConstructed && b.trainQueue.length < 2);
        if (readyBarracks.length === 0) return;

        let swords = 0, archers = 0, cannons = 0;
        for (const unit of enemySoldiers) {
          if (unit.subtype === "swordsman") swords++;
          else if (unit.subtype === "archer") archers++;
          else if (unit.subtype === "cannon") cannons++;
        }

        const playerSwords = this.playerIntel.swordsman || 0;
        const playerArchers = this.playerIntel.archer || 0;
        const playerCannons = this.playerIntel.cannon || 0;
        const totalArmy = swords + archers + cannons;
        let pick = "swordsman";
        if (totalArmy < 7) {
          if (swords < 3) pick = "swordsman";
          else if (archers < 3) pick = "archer";
          else if (cannons < 1) pick = "cannon";
        } else {
          if (playerArchers >= playerSwords + 2) pick = "swordsman";
          else if (playerSwords >= playerArchers + 2) pick = "archer";
          else if (swords > archers + 1) pick = "archer";
          else if (archers > swords + 1) pick = "swordsman";
          if (swords + archers >= 4 && cannons < 2 && (playerCannons > 0 || this.strategyMode === "assault")) pick = "cannon";
        }
        const choices = [pick, "swordsman", "archer", "cannon"];
        const chosen = choices.find((id, index) => choices.indexOf(id) === index && this.canAfford(CONFIG.UNITS[id].cost));
        if (chosen) {
          const spec = CONFIG.UNITS[chosen];
          this.spend(spec.cost);
          this.resources.popCurrent += 1;
          readyBarracks[0].enqueueUnit(chosen, spec.trainTime);
        }
      }

      getAttackFormationPoint(soldier, etc, playerTownCenter, soldiers) {
        const dx = playerTownCenter.x - etc.x, dy = playerTownCenter.y - etc.y;
        const len = Math.hypot(dx, dy) || 1;
        const fx = dx / len, fy = dy / len, px = -fy, py = fx;
        const centerX = clamp(etc.x + fx * 220, 96, CONFIG.WORLD_WIDTH - 96);
        const centerY = clamp(etc.y + fy * 220, 96, CONFIG.WORLD_HEIGHT - 96);
        const before = soldiers.slice(0, soldiers.indexOf(soldier)).filter((u) => u.subtype === soldier.subtype).length;
        let forward = -24, lateral = 0;
        if (soldier.subtype === "swordsman") {
          forward = 42 + Math.floor(before / 3) * 42;
          lateral = ((before % 3) - 1) * 42;
        } else if (soldier.subtype === "archer") {
          forward = -28 - Math.floor(before / 3) * 42;
          lateral = ((before % 3) - 1) * 42;
        } else if (soldier.subtype === "cannon") {
          forward = -105 - Math.floor(before / 2) * 52;
          lateral = (before % 2 === 0 ? -1 : 1) * 30 * Math.ceil((before + 1) / 2);
        }
        return { x: clamp(centerX + fx * forward + px * lateral, 48, CONFIG.WORLD_WIDTH - 48), y: clamp(centerY + fy * forward + py * lateral, 48, CONFIG.WORLD_HEIGHT - 48) };
      }

      commandArmy(world, etc, enemyBuildings, enemySoldiers, barracks) {
        const intruder = this.game.findNearestEnemy(etc.x, etc.y, 650, "enemy");
        const underPressure = !!intruder || this.threatLevel >= 2;

        if (underPressure) {
          this.statusLabel = "Bertahan Adaptif!";
          const defenseTarget = intruder || this.game.findNearestEnemy(etc.x, etc.y, 900, "enemy");
          if (defenseTarget) {
            for (const soldier of enemySoldiers) {
              if (!soldier.attackTarget || soldier.attackTarget.hp <= 0 ||
                  soldier.attackTarget.team !== "player") {
                soldier.commandAttack(defenseTarget, world);
              }
            }
          } else {
            const rallyX = clamp(etc.x + 115, 80, CONFIG.WORLD_WIDTH - 80);
            const rallyY = clamp(etc.y + 75, 80, CONFIG.WORLD_HEIGHT - 80);
            for (let i = 0; i < enemySoldiers.length; i++) {
              const soldier = enemySoldiers[i];
              if (soldier.attackTarget && soldier.attackTarget.hp > 0) continue;
              if (Math.hypot(soldier.x - rallyX, soldier.y - rallyY) > 65) {
                const angle = (i / Math.max(1, enemySoldiers.length)) * Math.PI * 2;
                soldier.commandMove(rallyX + Math.cos(angle) * 38, rallyY + Math.sin(angle) * 38, world);
              }
            }
          }
          this.isAttacking = false;
          this.isAssembling = false;
          return;
        }

        // Formasi inti 7 unit, lalu setiap gelombang berikutnya bertambah satu unit.
        const waveCapacity = Math.max(2, this.resources.popMax - 5);
        const waveThreshold = Math.min(waveCapacity, 7 + this.waveNumber - 1);
        if (!this.isAttacking && !this.isAssembling && enemySoldiers.length >= waveThreshold) {
          this.isAssembling = true;
          this.waveTimer = 0;
        } else if (this.isAttacking && enemySoldiers.length === 0) {
          this.isAttacking = false;
          this.isAssembling = false;
          this.waveTimer = 0;
          this.waveNumber++;
        }
        if (this.isAssembling && world.playerTownCenter) {
          this.statusLabel = `Menyusun Formasi (${enemySoldiers.length}/${waveThreshold})`;
          const slots = enemySoldiers.map((soldier) => this.getAttackFormationPoint(soldier, etc, world.playerTownCenter, enemySoldiers));
          let ready = true;
          const assemblyTimedOut = this.waveTimer >= 14;
          for (let i = 0; i < enemySoldiers.length; i++) {
            const soldier = enemySoldiers[i], slot = slots[i];
            const d = Math.hypot(soldier.x - slot.x, soldier.y - slot.y);
            if (d > 34) {
              ready = false;
              // Perbarui tujuan jika unit masih berjalan ke titik lama atau jalurnya buntu.
              const targetMismatch = soldier.targetX == null || soldier.targetY == null ||
                Math.hypot(soldier.targetX - slot.x, soldier.targetY - slot.y) > 22;
              const noPath = !soldier.waypoints || soldier.waypoints.length === 0;
              if (targetMismatch || (noPath && d > 50)) soldier.commandMove(slot.x, slot.y, world);
            }
          }
          // Jangan biarkan satu unit yang tersangkut menahan seluruh gelombang.
          // Setelah 14 detik, pasukan yang sudah terkumpul tetap diberangkatkan.
          if (ready || assemblyTimedOut) {
            this.isAssembling = false;
            this.isAttacking = true;
            this.waveTimer = 0;
            const lead = enemySoldiers.find((u) => u.subtype === "swordsman") || enemySoldiers[0] || etc;
            this.game.triggerAlertPing(lead.x, lead.y, `Serangan Musuh #${this.waveNumber}`);
            this.game.showToast(`Peringatan! Gelombang Serangan Musuh #${this.waveNumber} (${enemySoldiers.length} Pasukan) bergerak menyerang!`);
            this.game.sound.horn();
          }
          return;
        }
        if (this.isAttacking && world.playerTownCenter) {
          this.statusLabel = `Menyerang Adaptif (Gel. ${this.waveNumber})`;
          for (const soldier of enemySoldiers) {
            if (soldier.attackTarget && soldier.attackTarget.hp > 0) continue;
            const target = this.selectStrategicTarget(soldier, world, world.playerTownCenter);
            if (target) soldier.commandAttack(target, world);
          }
        } else {
          this.statusLabel = this.strategyMode === "expansion"
            ? `Berkembang (${enemyBuildings.length})`
            : this.strategyMode === "economy"
              ? `Ekonomi (${enemySoldiers.length}/${waveThreshold})`
              : `Siaga (${enemySoldiers.length}/${waveThreshold})`;

          const ptc = world.playerTownCenter;
          const dirX = ptc ? Math.sign(ptc.x - etc.x) || -1 : -1;
          const dirY = ptc ? Math.sign(ptc.y - etc.y) || 1 : 1;
          const rallyX = clamp(etc.x + dirX * 220, 96, CONFIG.WORLD_WIDTH - 96);
          const rallyY = clamp(etc.y + dirY * 220, 96, CONFIG.WORLD_HEIGHT - 96);
          for (let i = 0; i < enemySoldiers.length; i++) {
            const soldier = enemySoldiers[i];
            if (soldier.attackTarget && soldier.attackTarget.hp > 0) continue;
            if (soldier.status === "Berjalan") continue;
            const angle = (i / Math.max(1, enemySoldiers.length)) * Math.PI * 2;
            const formX = rallyX + Math.cos(angle) * 44;
            const formY = rallyY + Math.sin(angle) * 44;
            if (Math.hypot(soldier.x - formX, soldier.y - formY) > 48) {
              soldier.commandMove(formX, formY, world);
            }
          }
        }
      }
    }

    /* =========================================================================
       9. KAMERA RTS RESPONSIF (MOUSE, TOUCH DRAG, SCROLL ZOOM, PINCH ZOOM)
       ========================================================================= */
    class RTSCamera {
      constructor(viewW, viewH) {
        this.x = 0;
        this.y = 0;
        this.zoom = 1.15;
        this.viewW = viewW;
        this.viewH = viewH;
      }

      resize(w, h) {
        this.viewW = w;
        this.viewH = h;
        this.clampPosition();
      }

      centerOn(wx, wy) {
        this.x = wx - (this.viewW * 0.5) / this.zoom;
        this.y = wy - (this.viewH * 0.5) / this.zoom;
        this.clampPosition();
      }

      panByScreenDelta(dx, dy) {
        this.x -= dx / this.zoom;
        this.y -= dy / this.zoom;
        this.clampPosition();
      }

      setZoomAtScreenPoint(newZoom, sx, sy) {
        const clamped = clamp(newZoom, CONFIG.MIN_ZOOM, CONFIG.MAX_ZOOM);
        const before = this.screenToWorld(sx, sy);
        this.zoom = clamped;
        this.x = before.x - sx / this.zoom;
        this.y = before.y - sy / this.zoom;
        this.clampPosition();
      }

      screenToWorld(sx, sy) {
        return {
          x: this.x + sx / this.zoom,
          y: this.y + sy / this.zoom
        };
      }

      clampPosition() {
        const maxX = Math.max(0, CONFIG.WORLD_WIDTH - this.viewW / this.zoom);
        const maxY = Math.max(0, CONFIG.WORLD_HEIGHT - this.viewH / this.zoom);
        this.x = clamp(this.x, 0, maxX);
        this.y = clamp(this.y, 0, maxY);
      }
    }

    /* =========================================================================
       10. CONTROLLER GAME UTAMA (GAME LOOP, INPUT, RENDERING & UI)
       ========================================================================= */
    class KingdomWarGame {
      constructor() {
        this.canvas = document.getElementById("gameCanvas");
        this.ctx = this.canvas.getContext("2d");
        this.minimapCanvas = document.getElementById("minimapCanvas");
        this.minimapCtx = this.minimapCanvas.getContext("2d");
        this.portraitCanvas = document.getElementById("portraitCanvas");
        this.portraitCtx = this.portraitCanvas.getContext("2d");

        this.sound = new SoundEffects();
        this.baker = new PixelArtBaker();
        this.baker.bakeAll();

        this.camera = new RTSCamera(window.innerWidth, window.innerHeight);
        this.world = null;
        this.enemyAI = null;

        this.seed = Math.floor(100000 + Math.random() * 899999);
        this.isPaused = true;
        this.gameOver = false;
        this.lastFrameTime = 0;
        this.globalTime = 0;
        this.waterFrame = 0;
        this.flagFrame = 0;
        this.uiRefreshTimer = 0;
        // Minimap cukup diperbarui setiap 6 frame (sekitar 5–10 kali/detik).
        this.minimapFrameCounter = 5;

        this.resources = {
          food: 500,
          wood: 500,
          stone: 300,
          gold: 200,
          popCurrent: 5,
          popMax: 20
        };

        this.playerTech = { gather: 0, swordsman: 0, archer: 0, cannon: 0 };
        this.activeResearch = null;
        this.alertPing = null;

        this.selectedEntities = [];
        this.projectiles = [];
        this.particles = [];

        this.buildMode = { active: false, subtype: null, worldX: 0, worldY: 0, valid: false };
        this.demolishMode = false;

        // State interaksi pointer & touch
        this.pointerDown = false;
        this.isDraggingPan = false;
        this.isSelectingBox = false;
        this.dragStartScreen = { x: 0, y: 0 };
        this.dragCurrentScreen = { x: 0, y: 0 };
        this.activeTouches = new Map();
        this.lastPinchDist = 0;

        this.resizeCanvas();
        this.bindEvents();
        this.startNewWorld(this.seed, true);
        this.showStartMenu();

        requestAnimationFrame((ts) => this.loop(ts));
      }

      resizeCanvas() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        this.canvas.width = w;
        this.canvas.height = h;
        this.ctx.imageSmoothingEnabled = false;
        this.camera.resize(w, h);
      }

      startNewWorld(seed = Math.floor(100000 + Math.random() * 899999), keepPaused = false) {
        this.seed = seed;
        this.gameOver = false;
        this.isPaused = keepPaused;

        this.resources = {
          food: 500,
          wood: 500,
          stone: 300,
          gold: 200,
          popCurrent: 5,
          popMax: 20
        };
        this.playerTech = { gather: 0, swordsman: 0, archer: 0, cannon: 0 };
        this.activeResearch = null;
        this.alertPing = null;
        this.minimapFrameCounter = 5;
        this.selectedEntities = [];
        this.projectiles = [];
        this.particles = [];
        this.cancelBuildMode();

        this.world = new WorldMap(this.seed, this.baker);
        this.world.generate();
        this.enemyAI = new EnemyAI(this);

        if (this.world.playerTownCenter) {
          this.camera.centerOn(this.world.playerTownCenter.x, this.world.playerTownCenter.y);
        }

        this.updateResourceHUD();
        this.updateSelectionPanel();
        document.getElementById("btnPause").textContent = this.isPaused ? "Resume" : "Pause";
      }

      /* -----------------------------------------------------------------------
         MANAJEMEN SUMBER DAYA, KONSTRUKSI, PELATIHAN & RISET
         ----------------------------------------------------------------------- */
      canAfford(cost) {
        return (
          this.resources.food >= (cost.food || 0) &&
          this.resources.wood >= (cost.wood || 0) &&
          this.resources.stone >= (cost.stone || 0) &&
          this.resources.gold >= (cost.gold || 0)
        );
      }

      spend(cost) {
        this.resources.food -= cost.food || 0;
        this.resources.wood -= cost.wood || 0;
        this.resources.stone -= cost.stone || 0;
        this.resources.gold -= cost.gold || 0;
        this.updateResourceHUD();
      }

      depositResource(team, type, amount) {
        if (!type || amount <= 0) return;
        if (team === "player") {
          this.resources[type] = (this.resources[type] || 0) + amount;
          this.updateResourceHUD();
        } else if (this.enemyAI) {
          this.enemyAI.resources[type] = (this.enemyAI.resources[type] || 0) + amount;
        }
      }

      startBuildMode(subtype) {
        const spec = CONFIG.BUILDINGS[subtype];
        if (!spec) return;
        if (!this.canAfford(spec.cost)) {
          this.showToast(`Sumber daya tidak cukup untuk ${spec.name}!`);
          return;
        }
        this.buildMode.active = true;
        this.buildMode.subtype = subtype;
        const centerWorld = this.camera.screenToWorld(this.canvas.width * 0.5, this.canvas.height * 0.45);
        this.updateBuildPreview(centerWorld.x, centerWorld.y);

        const banner = document.getElementById("buildBanner");
        document.getElementById("buildBannerText").textContent = `Tempatkan ${spec.name} di lahan terbuka`;
        banner.style.display = "flex";
      }

      cancelBuildMode() {
        this.buildMode.active = false;
        this.buildMode.subtype = null;
        document.getElementById("buildBanner").style.display = "none";
      }

      startDemolishMode() {
        this.demolishMode = true;
        this.cancelBuildMode();
        this.showToast("Mode bongkar aktif: ketuk bangunan kerajaan sendiri");
      }

      cancelDemolishMode() {
        this.demolishMode = false;
      }

      updateBuildPreview(wx, wy) {
        if (!this.buildMode.active) return;
        const spec = CONFIG.BUILDINGS[this.buildMode.subtype];
        const gx = Math.floor(wx / 32) * 32 + (spec.tileW % 2 === 1 ? 16 : 0);
        const gy = Math.floor(wy / 32) * 32 + (spec.tileH % 2 === 1 ? 16 : 0);
        this.buildMode.worldX = gx;
        this.buildMode.worldY = gy;
        this.buildMode.valid = this.world.canPlaceBuilding(this.buildMode.subtype, gx, gy);
      }

      confirmPlaceBuilding(wx, wy) {
        this.updateBuildPreview(wx, wy);
        if (!this.buildMode.valid) {
          this.showToast("Lokasi terhalang! Pilih lahan rumput/tanah kosong.");
          return;
        }
        const subtype = this.buildMode.subtype;
        const spec = CONFIG.BUILDINGS[subtype];
        if (!this.canAfford(spec.cost)) {
          this.showToast("Sumber daya tidak mencukupi!");
          this.cancelBuildMode();
          return;
        }

        this.spend(spec.cost);
        const b = new Building(subtype, "player", this.buildMode.worldX, this.buildMode.worldY, false);
        this.world.buildings.push(b);
        this.world.rebuildNavGrid();
        this.world.bakeMinimapBase();
        this.sound.build();

        // Kerahkan warga terpilih (atau warga terdekat) untuk membangun
        let builders = this.selectedEntities.filter((e) => e.type === "worker" && e.team === "player" && e.hp > 0);
        if (builders.length === 0) {
          const fallback = this.world.workers.find((w) => w.team === "player" && w.hp > 0);
          if (fallback) builders = [fallback];
        }
        for (const w of builders) {
          w.commandInteract(b, this.world);
        }

        this.showToast(`Memulai pembangunan ${spec.name}`);
        this.cancelBuildMode();
      }

      onBuildingCompleted(building) {
        if (building.subtype === "house") {
          if (building.team === "player") {
            this.resources.popMax += 5;
            this.updateResourceHUD();
            this.showToast("Rumah Warga Selesai (+5 Kapasitas Populasi)");
          } else {
            this.enemyAI.resources.popMax += 5;
          }
        } else if (building.team === "player") {
          this.showToast(`${building.name} Selesai Dibangun!`);
        }
      }

      onResourceDepleted(prop) {
        if (!prop) return;
        const burstColor = prop.type === "tree" ? "#4ade80" : prop.type === "gold" ? "#fde047" : "#9ca3af";
        for (let i = 0; i < 10; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 22 + Math.random() * 44;
          this.particles.push({
            x: prop.x,
            y: prop.y - 10,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 16,
            life: 0.4,
            maxLife: 0.4,
            size: 3,
            color: burstColor
          });
        }
        this.world.removeProp(prop);
      }

      trainUnitFromBuilding(building, unitSubtype) {
        const spec = CONFIG.UNITS[unitSubtype];
        if (!spec || !building.isConstructed) return;
        if (building.trainQueue.length >= 4) {
          this.showToast("Antrean pelatihan penuh (maksimal 4)!");
          return;
        }
        if (this.resources.popCurrent >= this.resources.popMax) {
          this.showToast("Populasi penuh! Bangun Rumah Warga terlebih dahulu.");
          return;
        }
        if (!this.canAfford(spec.cost)) {
          this.showToast(`Sumber daya tidak cukup untuk melatih ${spec.name}!`);
          return;
        }

        this.spend(spec.cost);
        this.resources.popCurrent += 1;
        this.updateResourceHUD();
        building.enqueueUnit(unitSubtype, spec.trainTime);
        this.sound.command();
        this.showToast(`Melatih ${spec.name}...`);
        this.updateSelectionPanel();
      }

      spawnTrainedUnit(building, unitSubtype) {
        const spawnTile = this.world.findNearestWalkableTile(
          Math.floor(building.x / 32),
          Math.floor((building.y + 42) / 32),
          5
        );
        const sx = spawnTile ? spawnTile.c * 32 + 16 : building.x;
        const sy = spawnTile ? spawnTile.r * 32 + 16 : building.y + 42;

        if (unitSubtype === "worker") {
          const count = this.world.workers.filter((w) => w.team === building.team).length + 1;
          const w = new WorkerUnit(
            building.team,
            building.team === "player" ? `Warga #${count}` : `Pekerja Musuh #${count}`,
            sx,
            sy
          );
          this.world.workers.push(w);
          if (building.team === "player") this.showToast(`${w.name} siap bekerja!`);
        } else {
          const s = new CombatUnit(unitSubtype, building.team, sx, sy);
          this.world.soldiers.push(s);
          if (building.team === "player") this.showToast(`${s.name} siap bertempur!`);
        }
      }

      getTechMultiplier(team, category) {
        const techState = team === "player" ? this.playerTech : (this.enemyAI ? this.enemyAI.tech : null);
        const level = techState ? (techState[category] || 0) : 0;
        const spec = TECH_UPGRADES[category];
        return 1 + level * (spec ? spec.bonusPerLevel : 0.25);
      }

      getTechUpgradeCost(techId, currentLevel) {
        const spec = TECH_UPGRADES[techId];
        const mult = 1 + currentLevel * 0.65;
        const cost = {};
        for (const k of Object.keys(spec.baseCost)) {
          cost[k] = Math.round(spec.baseCost[k] * mult);
        }
        return cost;
      }

      startTechResearch(techId, blacksmith) {
        const spec = TECH_UPGRADES[techId];
        const currentLv = this.playerTech[techId] || 0;
        if (!spec || currentLv >= spec.maxLevel) return;
        if (this.activeResearch) {
          this.showToast("Pandai Besi sedang meneliti teknologi lain!");
          return;
        }
        const cost = this.getTechUpgradeCost(techId, currentLv);
        if (!this.canAfford(cost)) {
          this.showToast("Sumber daya tidak cukup untuk riset ini!");
          return;
        }
        this.spend(cost);
        this.activeResearch = {
          techId,
          building: blacksmith,
          timer: 0,
          duration: spec.researchTime
        };
        this.sound.build();
        this.showToast(`Memulai riset ${spec.name} Lv.${currentLv + 1}...`);
        this.updateSelectionPanel();
      }

      /* -----------------------------------------------------------------------
         PERTEMPURAN, PROYEKTIL & DETEKSI MUSUH
         ----------------------------------------------------------------------- */
      findNearestEnemy(x, y, maxRange, myTeam) {
        const enemyTeam = myTeam === "player" ? "enemy" : "player";
        let best = null;
        let bestDist = maxRange;

        for (let i = 0; i < this.world.soldiers.length; i++) {
          const s = this.world.soldiers[i];
          if (s.team !== enemyTeam || s.hp <= 0) continue;
          const d = Math.hypot(s.x - x, s.y - y);
          if (d < bestDist) { bestDist = d; best = s; }
        }
        for (let i = 0; i < this.world.workers.length; i++) {
          const w = this.world.workers[i];
          if (w.team !== enemyTeam || w.hp <= 0) continue;
          const d = Math.hypot(w.x - x, w.y - y);
          if (d < bestDist) { bestDist = d; best = w; }
        }
        return best;
      }

      findNearestEnemyBuilding(x, y, myTeam) {
        const enemyTeam = myTeam === "player" ? "enemy" : "player";
        let best = null;
        let bestDist = Infinity;
        for (let i = 0; i < this.world.buildings.length; i++) {
          const b = this.world.buildings[i];
          if (b.team !== enemyTeam || b.hp <= 0) continue;
          const d = Math.hypot(b.x - x, b.y - y);
          if (d < bestDist) { bestDist = d; best = b; }
        }
        return best;
      }

      spawnProjectile(kind, team, x, y, target, damage, splashRadius = 0) {
        this.projectiles.push({
          kind,
          team,
          x,
          y,
          target,
          tx: target.x,
          ty: target.y,
          speed: kind === "cannonball" ? 240 : 320,
          damage,
          splashRadius
        });
      }

      applyDamage(target, damage, attacker) {
        if (!target || target.hp <= 0) return;
        target.hp -= damage;

        // Jika warga/pasukan diserang, pasukan terdekat membela
        if (target.team === "player" && attacker && this.isPointOnScreen(target.x, target.y)) {
          this.triggerAlertPing(target.x, target.y, "Kerajaan Diserang!");
        }

        if (target.hp <= 0) {
          target.hp = 0;
          this.handleEntityDeath(target);
        }
      }

      handleEntityDeath(ent) {
        // Hapus dari seleksi
        const selIdx = this.selectedEntities.indexOf(ent);
        if (selIdx !== -1) this.selectedEntities.splice(selIdx, 1);

        if (ent.type === "worker") {
          const idx = this.world.workers.indexOf(ent);
          if (idx !== -1) this.world.workers.splice(idx, 1);
          if (ent.team === "player") {
            this.resources.popCurrent = Math.max(0, this.resources.popCurrent - 1);
            this.updateResourceHUD();
          } else {
            this.enemyAI.resources.popCurrent = Math.max(0, this.enemyAI.resources.popCurrent - 1);
          }
        } else if (ent.type === "soldier") {
          const idx = this.world.soldiers.indexOf(ent);
          if (idx !== -1) this.world.soldiers.splice(idx, 1);
          if (ent.team === "player") {
            this.resources.popCurrent = Math.max(0, this.resources.popCurrent - 1);
            this.updateResourceHUD();
          } else {
            this.enemyAI.resources.popCurrent = Math.max(0, this.enemyAI.resources.popCurrent - 1);
          }
        } else if (ent.type === "building") {
          if (ent.subtype === "house") {
            if (ent.team === "player") this.resources.popMax = Math.max(5, this.resources.popMax - 5);
            else this.enemyAI.resources.popMax = Math.max(5, this.enemyAI.resources.popMax - 5);
          }
          this.world.removeBuilding(ent);
          this.updateResourceHUD();

          if (ent.subtype === "towncenter") {
            this.gameOver = true;
            this.isPaused = true;
            this.showEndScreen(ent.team === "enemy");
          }
        }
      }

      triggerAlertPing(x, y, label = "Bahaya!") {
        this.alertPing = { x, y, timer: 12, label };
        const btn = document.getElementById("btnAlertJump");
        if (btn) btn.style.display = "flex";
      }

      /* -----------------------------------------------------------------------
         SELEKSI UNIT & PERINTAH KLIK / TAP
         ----------------------------------------------------------------------- */
      findEntityAtWorldPoint(wx, wy) {
        // Prioritaskan unit bergerak
        for (let i = this.world.workers.length - 1; i >= 0; i--) {
          const w = this.world.workers[i];
          if (Math.hypot(w.x - wx, (w.y - 8) - wy) <= 18) return w;
        }
        for (let i = this.world.soldiers.length - 1; i >= 0; i--) {
          const s = this.world.soldiers[i];
          if (Math.hypot(s.x - wx, (s.y - 8) - wy) <= 18) return s;
        }
        // Lalu bangunan
        for (let i = this.world.buildings.length - 1; i >= 0; i--) {
          const b = this.world.buildings[i];
          const hw = (b.tileW * 32) * 0.5;
          const hh = (b.tileH * 32) * 0.5;
          if (Math.abs(wx - b.x) <= hw && Math.abs(wy - (b.y - 6)) <= hh) return b;
        }
        // Lalu sumber daya
        for (let i = this.world.staticProps.length - 1; i >= 0; i--) {
          const p = this.world.staticProps[i];
          if (!p.solid) continue;
          if (Math.hypot(p.x - wx, (p.y - 10) - wy) <= 18) return p;
        }
        return null;
      }

      handleTapAtScreen(sx, sy) {
        this.sound.unlock();
        const worldPos = this.camera.screenToWorld(sx, sy);

        if (this.buildMode.active) {
          this.confirmPlaceBuilding(worldPos.x, worldPos.y);
          return;
        }

        const hit = this.findEntityAtWorldPoint(worldPos.x, worldPos.y);

        if (this.demolishMode) {
          const workers = this.selectedEntities.filter((e) => e && e.type === "worker" && e.team === "player" && e.hp > 0);
          if (hit && hit.type === "building" && hit.team === "player" && hit.subtype !== "towncenter" && workers.length > 0) {
            for (const worker of workers) worker.commandDemolish(hit, this.world);
            this.showToast("Warga mulai membongkar bangunan. Tidak ada sumber daya yang dikembalikan.");
          } else {
            this.showToast("Pilih bangunan milik sendiri (Town Center tidak bisa dibongkar).");
          }
          this.cancelDemolishMode();
          this.updateSelectionPanel();
          return;
        }
        const hasPlayerUnitsSelected = this.selectedEntities.some(
          (e) => e.team === "player" && (e.type === "worker" || e.type === "soldier")
        );

        // Jika mengetuk entitas
        if (hit) {
          if (hit.team === "player") {
            // Warga terpilih bisa melanjutkan pembangunan, bekerja di sawah,
            // atau memperbaiki bangunan sendiri yang HP-nya belum penuh.
            if (hasPlayerUnitsSelected && hit.type === "building" &&
                (!hit.isConstructed || hit.subtype === "farm" || hit.hp < hit.maxHp)) {
              this.issueCommandToSelected(worldPos.x, worldPos.y, hit);
              return;
            }
            this.selectedEntities = [hit];
            this.sound.select();
            this.updateSelectionPanel();
            return;
          }

          if (hasPlayerUnitsSelected) {
            // Perintahkan unit terpilih untuk berinteraksi / menyerang
            if (hit.team === "enemy") {
              this.issueCommandToSelected(worldPos.x, worldPos.y, hit);
              return;
            }
            if (hit.resourceType) {
              this.issueCommandToSelected(worldPos.x, worldPos.y, hit);
              return;
            }
          }

          // Inspeksi musuh atau sumber daya
          this.selectedEntities = [hit];
          this.sound.select();
          this.updateSelectionPanel();
          return;
        }

        // Mengetuk tanah kosong: gerakkan unit pemain yang sedang dipilih
        if (hasPlayerUnitsSelected) {
          this.issueCommandToSelected(worldPos.x, worldPos.y, null);
        } else {
          this.selectedEntities = [];
          this.updateSelectionPanel();
        }
      }

      issueCommandToSelected(wx, wy, targetEntity) {
        const units = this.selectedEntities.filter(
          (e) => e.team === "player" && e.hp > 0 && (e.type === "worker" || e.type === "soldier")
        );
        if (units.length === 0) return;

        this.sound.command();
        this.spawnMoveMarker(wx, wy, targetEntity && targetEntity.team === "enemy" ? "#ef4444" : "#22c55e");

        // Formasi grid memberi setiap unit titik berhenti sendiri.
        // Jarak 34px menjaga ruang antar radius unit sekaligus tetap rapat.
        const columns = Math.ceil(Math.sqrt(units.length));
        const rows = Math.ceil(units.length / columns);
        const spacing = 34;

        for (let i = 0; i < units.length; i++) {
          const u = units[i];
          const col = i % columns;
          const row = Math.floor(i / columns);
          const slotX = wx + (col - (columns - 1) / 2) * spacing;
          const slotY = wy + (row - (rows - 1) / 2) * spacing;

          if (u.type === "worker") {
            if (targetEntity && (targetEntity.resourceType || (targetEntity.team === "player" && targetEntity.type === "building"))) {
              u.commandInteract(targetEntity, this.world);
            } else {
              // Warga mendekat ke musuh atau bergerak ke slot formasinya.
              u.commandMove(slotX, slotY, this.world);
            }
          } else if (u.type === "soldier") {
            if (targetEntity && targetEntity.team === "enemy") {
              u.commandAttack(targetEntity, this.world);
            } else {
              u.commandMove(slotX, slotY, this.world);
            }
          }
        }
        this.updateSelectionPanel();
      }

      spawnMoveMarker(wx, wy, color) {
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          this.particles.push({
            x: wx + Math.cos(ang) * 8,
            y: wy + Math.sin(ang) * 8,
            vx: Math.cos(ang) * 18,
            vy: Math.sin(ang) * 18,
            life: 0.35,
            maxLife: 0.35,
            size: 2,
            color
          });
        }
      }

      selectUnitsInScreenBox(x0, y0, x1, y1) {
        const minX = Math.min(x0, x1);
        const maxX = Math.max(x0, x1);
        const minY = Math.min(y0, y1);
        const maxY = Math.max(y0, y1);

        const topLeft = this.camera.screenToWorld(minX, minY);
        const botRight = this.camera.screenToWorld(maxX, maxY);

        const picked = [];
        for (const w of this.world.workers) {
          if (w.team === "player" && w.x >= topLeft.x && w.x <= botRight.x && w.y >= topLeft.y && w.y <= botRight.y) {
            picked.push(w);
          }
        }
        for (const s of this.world.soldiers) {
          if (s.team === "player" && s.x >= topLeft.x && s.x <= botRight.x && s.y >= topLeft.y && s.y <= botRight.y) {
            picked.push(s);
          }
        }

        if (picked.length > 0) {
          this.selectedEntities = picked;
          this.sound.select();
          this.updateSelectionPanel();
        }
      }

      selectAllWorkers() {
        const workers = this.world.workers.filter((w) => w.team === "player" && w.hp > 0);
        if (workers.length === 0) {
          this.showToast("Tidak ada warga yang tersisa.");
          return;
        }
        this.selectedEntities = workers;
        this.sound.select();
        this.updateSelectionPanel();
        this.showToast(`${workers.length} Warga Kerajaan dipilih!`);
      }

      selectIdleWorker() {
        const workers = this.world.workers.filter((w) => w.team === "player" && w.hp > 0);
        if (workers.length === 0) {
          this.showToast("Tidak ada warga yang tersisa.");
          return;
        }
        const idle = workers.find((w) => w.status === "Idle") || workers[0];
        this.selectedEntities = [idle];
        this.camera.centerOn(idle.x, idle.y);
        this.sound.select();
        this.updateSelectionPanel();
        this.showToast(idle.status === "Idle" ? `${idle.name} siap bekerja!` : `Menyorot ${idle.name}`);
      }

      selectAllArmy() {
        const soldiers = this.world.soldiers.filter((s) => s.team === "player" && s.hp > 0);
        if (soldiers.length === 0) {
          this.showToast("Belum ada pasukan! Bangun Barak untuk melatih pasukan.");
          return;
        }
        this.selectedEntities = soldiers;
        let ax = 0, ay = 0;
        for (const s of soldiers) { ax += s.x; ay += s.y; }
        this.camera.centerOn(ax / soldiers.length, ay / soldiers.length);
        this.sound.select();
        this.updateSelectionPanel();
        this.showToast(`${soldiers.length} Pasukan Tempur dipilih!`);
      }

      /* -----------------------------------------------------------------------
         EVENT LISTENER DESKTOP & ANDROID TOUCHSCREEN
         ----------------------------------------------------------------------- */
      bindEvents() {
        window.addEventListener("resize", () => this.resizeCanvas());

        // Mouse & Touch pada Canvas Utama
        this.canvas.addEventListener("mousedown", (e) => {
          if (e.button === 2) {
            const worldPos = this.camera.screenToWorld(e.clientX, e.clientY);
            const hit = this.findEntityAtWorldPoint(worldPos.x, worldPos.y);
            this.issueCommandToSelected(worldPos.x, worldPos.y, hit);
            return;
          }
          if (e.button !== 0) return;
          this.pointerDown = true;
          this.isDraggingPan = false;
          this.isSelectingBox = false;
          this.dragStartScreen = { x: e.clientX, y: e.clientY };
          this.dragCurrentScreen = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener("mousemove", (e) => {
          if (this.buildMode.active) {
            const wp = this.camera.screenToWorld(e.clientX, e.clientY);
            this.updateBuildPreview(wp.x, wp.y);
          }
          if (!this.pointerDown) return;
          const dx = e.clientX - this.dragStartScreen.x;
          const dy = e.clientY - this.dragStartScreen.y;
          if (!this.isDraggingPan && !this.isSelectingBox && Math.hypot(dx, dy) > 8) {
            if (e.shiftKey) this.isSelectingBox = true;
            else this.isDraggingPan = true;
          }
          if (this.isDraggingPan) {
            this.camera.panByScreenDelta(e.clientX - this.dragCurrentScreen.x, e.clientY - this.dragCurrentScreen.y);
          }
          this.dragCurrentScreen = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener("mouseup", (e) => {
          if (!this.pointerDown) return;
          this.pointerDown = false;
          if (this.isSelectingBox) {
            this.selectUnitsInScreenBox(
              this.dragStartScreen.x,
              this.dragStartScreen.y,
              this.dragCurrentScreen.x,
              this.dragCurrentScreen.y
            );
          } else if (!this.isDraggingPan) {
            this.handleTapAtScreen(e.clientX, e.clientY);
          }
          this.isDraggingPan = false;
          this.isSelectingBox = false;
        });

        this.canvas.addEventListener("contextmenu", (e) => e.preventDefault());

        // Scroll Zoom Desktop
        this.canvas.addEventListener("wheel", (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.12 : 0.89;
          this.camera.setZoomAtScreenPoint(this.camera.zoom * factor, e.clientX, e.clientY);
        }, { passive: false });

        // Touch Events Android (1 jari tap/drag, 2 jari pinch zoom)
        this.canvas.addEventListener("touchstart", (e) => {
          e.preventDefault();
          this.sound.unlock();
          for (const t of e.changedTouches) {
            this.activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
          }
          if (this.activeTouches.size === 1) {
            const t = e.changedTouches[0];
            this.pointerDown = true;
            this.isDraggingPan = false;
            this.dragStartScreen = { x: t.clientX, y: t.clientY };
            this.dragCurrentScreen = { x: t.clientX, y: t.clientY };
          } else if (this.activeTouches.size === 2) {
            this.pointerDown = false;
            this.isDraggingPan = false;
            const pts = Array.from(this.activeTouches.values());
            this.lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          }
        }, { passive: false });

        this.canvas.addEventListener("touchmove", (e) => {
          e.preventDefault();
          for (const t of e.changedTouches) {
            if (this.activeTouches.has(t.identifier)) {
              this.activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
            }
          }
          if (this.activeTouches.size === 2) {
            const pts = Array.from(this.activeTouches.values());
            const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
            if (this.lastPinchDist > 0) {
              const midX = (pts[0].x + pts[1].x) * 0.5;
              const midY = (pts[0].y + pts[1].y) * 0.5;
              this.camera.setZoomAtScreenPoint(this.camera.zoom * (dist / this.lastPinchDist), midX, midY);
            }
            this.lastPinchDist = dist;
          } else if (this.activeTouches.size === 1 && this.pointerDown) {
            const t = e.changedTouches[0];
            const dx = t.clientX - this.dragStartScreen.x;
            const dy = t.clientY - this.dragStartScreen.y;
            if (!this.isDraggingPan && Math.hypot(dx, dy) > 10) {
              this.isDraggingPan = true;
            }
            if (this.isDraggingPan) {
              this.camera.panByScreenDelta(t.clientX - this.dragCurrentScreen.x, t.clientY - this.dragCurrentScreen.y);
            }
            this.dragCurrentScreen = { x: t.clientX, y: t.clientY };
          }
        }, { passive: false });

        this.canvas.addEventListener("touchend", (e) => {
          e.preventDefault();
          for (const t of e.changedTouches) {
            this.activeTouches.delete(t.identifier);
          }
          if (this.activeTouches.size === 0) {
            if (this.pointerDown && !this.isDraggingPan && e.changedTouches.length > 0) {
              const t = e.changedTouches[0];
              this.handleTapAtScreen(t.clientX, t.clientY);
            }
            this.pointerDown = false;
            this.isDraggingPan = false;
            this.lastPinchDist = 0;
          }
        }, { passive: false });

        // Minimap Klik / Sentuh
        const moveCamFromMinimap = (clientX, clientY) => {
          const rect = this.minimapCanvas.getBoundingClientRect();
          const rx = clamp((clientX - rect.left) / rect.width, 0, 1);
          const ry = clamp((clientY - rect.top) / rect.height, 0, 1);
          this.camera.centerOn(rx * CONFIG.WORLD_WIDTH, ry * CONFIG.WORLD_HEIGHT);
        };
        this.minimapCanvas.addEventListener("mousedown", (e) => moveCamFromMinimap(e.clientX, e.clientY));
        this.minimapCanvas.addEventListener("touchstart", (e) => {
          e.preventDefault();
          if (e.touches.length > 0) moveCamFromMinimap(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // Tombol HUD & Kamera
        document.getElementById("btnZoomIn").addEventListener("click", () => {
          this.camera.setZoomAtScreenPoint(this.camera.zoom * 1.2, this.canvas.width * 0.5, this.canvas.height * 0.5);
        });
        document.getElementById("btnZoomOut").addEventListener("click", () => {
          this.camera.setZoomAtScreenPoint(this.camera.zoom * 0.82, this.canvas.width * 0.5, this.canvas.height * 0.5);
        });
        document.getElementById("btnCenterTC").addEventListener("click", () => {
          if (this.world.playerTownCenter) {
            this.camera.centerOn(this.world.playerTownCenter.x, this.world.playerTownCenter.y);
          }
        });
        document.getElementById("cancelBuildBtn").addEventListener("click", () => this.cancelBuildMode());
        document.getElementById("btnSelectAllWorkers").addEventListener("click", () => this.selectAllWorkers());
        document.getElementById("btnIdleWorker").addEventListener("click", () => this.selectIdleWorker());
        document.getElementById("btnSelectArmy").addEventListener("click", () => this.selectAllArmy());
        document.getElementById("btnAlertJump").addEventListener("click", () => {
          if (this.alertPing) this.camera.centerOn(this.alertPing.x, this.alertPing.y);
        });
        document.getElementById("btnPause").addEventListener("click", () => {
          if (this.gameOver) return;
          this.isPaused = !this.isPaused;
          document.getElementById("btnPause").textContent = this.isPaused ? "Resume" : "Pause";
          this.showToast(this.isPaused ? "Permainan Dijeda" : "Permainan Dilanjutkan");
        });
        document.getElementById("btnMenu").addEventListener("click", () => {
          this.isPaused = true;
          document.getElementById("btnPause").textContent = "Resume";
          this.showPauseMenu();
        });
      }

      /* -----------------------------------------------------------------------
         PEMBARUAN UI & PANEL KONTEKSTUAL BAWAH
         ----------------------------------------------------------------------- */
      updateResourceHUD() {
        document.getElementById("resFood").textContent = Math.floor(this.resources.food);
        document.getElementById("resWood").textContent = Math.floor(this.resources.wood);
        document.getElementById("resStone").textContent = Math.floor(this.resources.stone);
        document.getElementById("resGold").textContent = Math.floor(this.resources.gold);
        document.getElementById("resPop").textContent = `${this.resources.popCurrent}/${this.resources.popMax}`;
      }

      updateSelectionPanel() {
        const nameEl = document.getElementById("selName");
        const statsEl = document.getElementById("selStats");
        const statusEl = document.getElementById("selStatus");
        const grid = document.getElementById("actionGrid");

        // Bersihkan entitas mati dari seleksi
        this.selectedEntities = this.selectedEntities.filter((e) => e && e.hp > 0);

        if (this.selectedEntities.length === 0) {
          nameEl.textContent = "Kerajaan Pemain";
          statsEl.textContent = "Ketuk warga, bangunan, atau pasukan untuk memberi perintah";
          statusEl.textContent = `Seed Dunia: #${this.seed}`;
          grid.innerHTML = "";
          this.drawPortrait(null);
          return;
        }

        const primary = this.selectedEntities[0];
        this.drawPortrait(primary);

        if (this.selectedEntities.length > 1) {
          nameEl.textContent = `${this.selectedEntities.length} Unit Dipilih`;
          const workerCount = this.selectedEntities.filter((e) => e.type === "worker").length;
          const soldierCount = this.selectedEntities.filter((e) => e.type === "soldier").length;
          statsEl.textContent = `Warga: ${workerCount} | Pasukan: ${soldierCount}`;
          statusEl.textContent = "Ketuk lahan/pohon/musuh untuk perintah kelompok";
        } else {
          nameEl.textContent = primary.name;
          if (primary.resourceType) {
            statsEl.textContent = `Sisa Sumber Daya: ${primary.amount}/${primary.maxAmount}`;
            statusEl.textContent = "Pilih warga lalu ketuk objek ini untuk menambang/menebang";
          } else {
            statsEl.textContent = `HP: ${Math.ceil(primary.hp)}/${primary.maxHp}`;
            statusEl.textContent = `Status: ${primary.status}`;
          }
        }

        // Bangun tombol aksi kontekstual
        grid.innerHTML = "";

        const hasWorker = this.selectedEntities.some((e) => e.team === "player" && e.type === "worker");
        if (hasWorker) {
          const buildOptions = [
            { id: "house", label: "Rumah Warga", cost: "50W" },
            { id: "farm", label: "Persawahan", cost: "60W" },
            { id: "tower", label: "Tower Pemanah", cost: "100W 100S" },
            { id: "barracks", label: "Barak Pasukan", cost: "150W 50S" },
            { id: "blacksmith", label: "Pandai Besi", cost: "130W 90S" },
            { id: "wall", label: "Tembok Batu", cost: "25S" }
          ];
          for (const opt of buildOptions) {
            const btn = document.createElement("button");
            btn.className = "act-btn";
            btn.innerHTML = `<span>+ ${opt.label}</span><span class="act-cost">${opt.cost}</span>`;
            btn.addEventListener("click", () => this.startBuildMode(opt.id));
            grid.appendChild(btn);
          }
          const demolishBtn = document.createElement("button");
          demolishBtn.className = "act-btn";
          demolishBtn.innerHTML = "<span>⌫ Bongkar Bangunan</span><span class=\"act-cost\">Tanpa refund</span>";
          demolishBtn.addEventListener("click", () => this.startDemolishMode());
          grid.appendChild(demolishBtn);
          return;
        }

        if (this.selectedEntities.length === 1 && primary.team === "player" && primary.type === "building" && primary.isConstructed) {
          if (primary.subtype === "towncenter") {
            const btn = document.createElement("button");
            btn.className = "act-btn";
            btn.innerHTML = `<span>Latih Warga</span><span class="act-cost">50F (Antrean: ${primary.trainQueue.length})</span>`;
            btn.addEventListener("click", () => this.trainUnitFromBuilding(primary, "worker"));
            grid.appendChild(btn);
          } else if (primary.subtype === "barracks") {
            const troops = [
              { id: "swordsman", label: "Pasukan Pedang", cost: "60F 20G" },
              { id: "archer", label: "Pasukan Pemanah", cost: "50W 30G" },
              { id: "cannon", label: "Mobil Meriam", cost: "120W 100G" }
            ];
            for (const tr of troops) {
              const btn = document.createElement("button");
              btn.className = "act-btn";
              btn.innerHTML = `<span>${tr.label}</span><span class="act-cost">${tr.cost}</span>`;
              btn.addEventListener("click", () => this.trainUnitFromBuilding(primary, tr.id));
              grid.appendChild(btn);
            }
          } else if (primary.subtype === "blacksmith") {
            for (const spec of Object.values(TECH_UPGRADES)) {
              const lv = this.playerTech[spec.id] || 0;
              const maxed = lv >= spec.maxLevel;
              const cost = maxed ? null : this.getTechUpgradeCost(spec.id, lv);
              const costStr = maxed ? "MAKSIMAL" : Object.entries(cost).map(([k, v]) => `${v}${k[0].toUpperCase()}`).join(" ");
              const btn = document.createElement("button");
              btn.className = "act-btn";
              btn.disabled = maxed || Boolean(this.activeResearch);
              btn.innerHTML = `<span>${spec.name} Lv.${lv}</span><span class="act-cost">${costStr}</span>`;
              btn.addEventListener("click", () => this.startTechResearch(spec.id, primary));
              grid.appendChild(btn);
            }
          }
        }
      }

      drawPortrait(ent) {
        const ctx = this.portraitCtx;
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "#1a110a";
        ctx.fillRect(0, 0, 32, 32);
        if (!ent) return;

        const tm = ent.team === "enemy" ? "enemy" : "player";
        if (ent.type === "worker") {
          ctx.drawImage(this.baker.unitSprites[tm].worker[0], 4, 2);
        } else if (ent.type === "soldier") {
          ctx.drawImage(this.baker.unitSprites[tm][ent.subtype][0], 2, 1);
        } else if (ent.type === "tree") {
          ctx.drawImage(this.baker.trees[ent.variant] || this.baker.trees[0], 0, 0, 32, 32);
        } else if (ent.type === "rock") {
          ctx.drawImage(this.baker.rocks[0], 0, 2, 32, 28);
        } else if (ent.type === "gold") {
          ctx.drawImage(this.baker.golds[0], 0, 2, 32, 28);
        } else if (ent.type === "building") {
          if (ent.subtype === "towncenter") ctx.drawImage(this.baker.townCenterFrames[tm][0], 0, 0, 32, 32);
          else if (ent.subtype === "house") ctx.drawImage(this.baker.houses[tm], 0, 0, 32, 32);
          else if (ent.subtype === "farm") ctx.drawImage(this.baker.farmFrames[ent.farmStage || 3], 0, 0, 32, 32);
          else if (ent.subtype === "tower") ctx.drawImage(this.baker.towers[tm], 4, 0, 24, 32);
          else if (ent.subtype === "barracks") ctx.drawImage(this.baker.barracksFrames[tm][0], 0, 0, 32, 32);
          else if (ent.subtype === "blacksmith") ctx.drawImage(this.baker.blacksmithFrames[tm][0], 0, 0, 32, 32);
          else if (ent.subtype === "wall") ctx.drawImage(this.baker.wallSprites[tm], 0, 0, 32, 32);
        }
      }

      showToast(msg) {
        const box = document.getElementById("toastBox");
        box.textContent = msg;
        box.style.opacity = "1";
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
          box.style.opacity = "0";
        }, 2800);
      }

         MENU MODAL (START, PAUSE, SETTINGS, ABOUT, VICTORY/DEFEAT)

          <div class="modal-title">KINGDOM WAR 2D</div>
          <div class="modal-sub">Real-Time Strategy Kerajaan Medieval • Pixel Art Edition</div>
          <div class="menu-stack">
            <button class="menu-btn primary" id="mNewGame">NEW GAME</button>
            <button class="menu-btn" id="mSettings">SETTINGS</button>
            <button class="menu-btn" id="mAbout">ABOUT</button>
          </div>
        `;
        document.getElementById("mNewGame").addEventListener("click", () => {
          this.sound.unlock();
          this.startNewWorld(Math.floor(100000 + Math.random() * 899999), false);
          modal.style.display = "none";
          this.showToast(`Dunia Baru Dibuat (Seed #${this.seed})`);
        });
        document.getElementById("mSettings").addEventListener("click", () => this.showSettingsMenu(true));
        document.getElementById("mAbout").addEventListener("click", () => this.showAboutMenu());

          <div class="modal-title">MENU KERAJAAN</div>
          <div class="modal-sub">Seed Dunia Aktif: #${this.seed}</div>
          <div class="menu-stack">
            <button class="menu-btn primary" id="mResume">RESUME</button>
            <button class="menu-btn" id="mRestart">RESTART GAME (SEED SAMA)</button>
            <button class="menu-btn" id="mGenWorld">GENERATE NEW WORLD</button>
            <button class="menu-btn" id="mSettings2">SETTINGS</button>
          </div>
        `;
        document.getElementById("mResume").addEventListener("click", () => {
          this.isPaused = false;
          document.getElementById("btnPause").textContent = "Pause";
          modal.style.display = "none";
        });
        document.getElementById("mRestart").addEventListener("click", () => {
          this.startNewWorld(this.seed, false);
          modal.style.display = "none";
          this.showToast("Permainan diulang pada dunia yang sama");
        });
        document.getElementById("mGenWorld").addEventListener("click", () => {
          this.startNewWorld(Math.floor(100000 + Math.random() * 899999), false);
          modal.style.display = "none";

        document.getElementById("mSettings2").addEventListener("click", () => this.showSettingsMenu(false));
      }
