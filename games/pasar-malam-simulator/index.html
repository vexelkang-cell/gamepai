{t:'Capai total 20 pengunjung masuk',ok:()=>S.totV>=20,r:500},
{t:'Kumpulkan pendapatan total Rp1.500',ok:()=>S.tot>=1500,r:800},
{t:'Kepuasan ≥75% dengan ≥8 pengunjung di taman',ok:()=>S.sat>=75&&V.length>=8,r:1000},
{t:'Miliki 4 jenis wahana berbeda yang terhubung',ok:()=>new Set(S.objs.filter(o=>D[o.type].tk&&o.ok).map(o=>o.type)).size>=4,r:1200},
{t:'Capai total 60 pengunjung masuk',ok:()=>S.totV>=60,r:1000},
{t:'Raih reputasi ⭐3,8 atau lebih',ok:()=>S.rep>=3.8,r:1500},
{t:'Kumpulkan pendapatan total Rp8.000',ok:()=>S.tot>=8000,r:2000},
{t:'Sewa 1 petugas kebersihan dan 1 teknisi',ok:()=>S.cl>=1&&S.te>=1,r:800},
{t:'Punya 8 wahana terhubung dengan kepuasan ≥80%',ok:()=>S.objs.filter(o=>D[o.type].tk&&o.ok).length>=8&&S.sat>=80,r:3000}];
const TUT=['Langkah 1: pilih Jalur, lalu sentuh/seret dari gerbang ke atas (±5 petak).','Langkah 2: buka Wahana, pilih satu, sentuh area di samping jalan.','Langkah 3: tambah Toko, bangku, tempat sampah. Pantau uang & kepuasan.'];
let S,V=[],occ=[],gb,W,H,DPR=1,cam={x:0,y:0,z:1},cat='r',tool=null,rot=0,ghost=null,started=false,spd=1,sacc=0,hudT=0,saveT=0,satT=0,lastI='';
const fmt=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),idx=(x,y)=>y*N+x,inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const cnt=t=>S.objs.filter(o=>o.type==t).length;
function msg(t,ms=2500){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',ms)}
function mk(type,x,y,rot=0){const d=D[type];let w=d.w,h=d.d;if(rot%2)[w,h]=[h,w];return{type,x,y,w,d:h,rot,cap:d.cap||0,tk:d.tk||0,pr:d.pr||0,stock:d.pr?20:0,cond:100,on:true,q:[],riders:[],ang:0,rt:0,lt:0,earn:0,n:0,oh:[8,22],lv:1,rp:0,rq:0,reno:0}}
function newGame(mode){S={mode,money:mode=='misi'?1000:1500,objs:[],t:0,day:1,dt:0,fee:5,litter:0,tot:0,totV:0,ms:0,sat:70,wait:0,tut:0,dinc:0,dexp:0,last:null,sel:null,stockT:-99,noride:-99,paused:false,pens:[],cl:0,te:0,rep:3,ev:null,mv:null,lit:{},rs:{done:{},cur:null,prog:0}};S.objs.push(mk('gate',GX,GY),mk('road',GX,GY-1),mk('road',GX,GY-2));V=[];UN=[];ST=[];reb()}
const walk=i=>i>=0&&occ[i]&&(occ[i].type=='road'||occ[i].type=='gate');
function bfs(sx,sy){const d=new Int16Array(N*N).fill(-1),p=new Int16Array(N*N).fill(-1),s=idx(sx,sy);if(!walk(s))return{d,p,s};d[s]=0;p[s]=s;const q=[s];for(let h=0;h<q.length;h++){const c=q[h],x=c%N,y=c/N|0;for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,ny=y+b;if(!inb(nx,ny))continue;const n=idx(nx,ny);if(d[n]<0&&walk(n)){d[n]=d[c]+1;p[n]=c;q.push(n)}}}return{d,p,s}}
function acc(o){const r=[];for(let i=-1;i<=o.w;i++)for(let j=-1;j<=o.d;j++){if((i>=0&&i<o.w)==(j>=0&&j<o.d))continue;const x=o.x+i,y=o.y+j;if(inb(x,y)&&walk(idx(x,y)))r.push(idx(x,y))}return r}
function reb(){gd=true;occ=new Array(N*N).fill(null);S.objs.forEach(o=>{for(let i=0;i<o.w;i++)for(let j=0;j<o.d;j++)occ[idx(o.x+i,o.y+j)]=o});gb=bfs(GX,GY);S.objs.forEach(o=>{o.acc=acc(o);o.ok=o.acc.some(t=>gb.d[t]>=0)});V.forEach(v=>{if(v.st=='walk'){v.st='idle';v.x=v.tx+.5;v.y=v.ty+.5;v.path=[]}});ST.forEach(s=>{if(s.st=='walk'){s.st='idle';s.path=[];s.x=s.tx+.5;s.y=s.ty+.5}if(!walk(idx(s.tx,s.ty))){s.tx=GX;s.ty=GY;s.x=GX+.5;s.y=GY+.5;s.st='idle'}})}
function chk(type,x,y,w,h){for(let i=0;i<w;i++)for(let j=0;j<h;j++){if(!inb(x+i,y+j))return'Di luar area taman';if(occ[idx(x+i,y+j)])return'Terhalang objek lain'}
if(!S.mv&&D[type].cost>S.money)return'Uang tidak cukup';
if(type=='road'&&![[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>inb(x+a,y+b)&&walk(idx(x+a,y+b))))return'Jalan harus tersambung ke jalan/gerbang';return null}
const sp=a=>{S.money-=a;S.dexp+=a},inc=a=>{S.money+=a;S.dinc+=a;S.tot+=a};
function place(){if(!tool||!ghost)return;const r=chk(tool,ghost.x,ghost.y,ghost.w,ghost.h);if(r){msg(r);sfx('err');return}const nb=mk(tool,ghost.x,ghost.y,rot);nb.born=S.t;
if(S.mv){const m=S.mv;Object.assign(m,{x:nb.x,y:nb.y,w:nb.w,d:nb.d,rot:nb.rot,born:S.t,q:[],riders:[]});S.objs.push(m);S.mv=null;tool=null;ghost=null;reb();items();msg('Bangunan dipindahkan');confUI();return true}
sfx('build');S.objs.push(nb);UN.push({o:nb,c:D[tool].cost});if(UN.length>10)UN.shift();sp(D[tool].cost);if(tool!='road')FX.push({x:nb.x+nb.w/2,y:nb.y+nb.d/2,t:S.t,txt:'-'+fmt(D[tool].cost)});try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}reb();return true}
function del(o){const d=D[o.type];if(!d.cost)return;o.dead=true;[...o.q,...o.riders].forEach(v=>{v.st='idle';v.goal=null});S.objs=S.objs.filter(x=>x!==o);S.money+=Math.floor(d.cost*.6);S.sel=null;reb()}
function spawn(){if(V.length>=40)return;const m=40+Math.random()*80|0;if(m<S.fee)return;inc(S.fee);S.totV++;V.push({x:GX+.5,y:GY+.5,tx:GX,ty:GY,path:[],st:'idle',goal:null,purp:'',m:m-S.fee,h:Math.random()*.4,th:Math.random()*.4,pt:Math.random()*3|0,fru:.4+Math.random()*1.2,pat:12+Math.random()*28,vis:0,max:2+Math.random()*3|0,qt:0,bt:0,ox:Math.random()-.5,oy:Math.random()-.5,col:`hsl(${Math.random()*360|0},70%,55%)`})}
const pathTo=(p,t,s)=>{const r=[];let i=t;while(i!==s){r.push(i);i=p[i]}return r.reverse()};
function decide(v){const b=bfs(v.tx,v.ty);if(b.d[b.s]<0){v.dead=1;return}
const near=o=>{let m=1e9,t=-1;for(const a of o.acc)if(b.d[a]>=0&&b.d[a]<m){m=b.d[a];t=a}return t<0?null:{o,t}};
let shop=null,sm=1e9,rides=[];const rej={p:0,q:0};
for(const o of S.objs){const d=D[o.type];if(d.tk){if(!opn(o)||o.tk>v.m)continue;const n=near(o);if(!n)continue;if(o.tk>fairOf(o)*(1.1+v.fru*.5)){o.rp++;rej.p=1;continue}const ew=ewait(o);if(ew>v.pat){o.rq++;rej.q=1;continue}n.ew=ew;n.dist=b.d[n.t];rides.push(n)}else if(d.pr){if(!(d.food?v.h>.45:v.th>.45))continue;if(o.stock<=0){S.stockT=S.t;continue}if(o.pr>v.m)continue;if(o.pr>d.fair*(1.2+v.fru*.5)){rej.p=1;continue}const n=near(o);if(n&&b.d[n.t]<sm){sm=b.d[n.t];shop=n}}}
let pick=null;v.purp='ride';
if(shop){pick=shop;v.purp='shop'}else if(rides.length&&v.vis<v.max)pick=bestR(rides,v);
if(!pick){if(!S.objs.some(o=>D[o.type].tk&&o.ok&&o.on&&o.cond>=20))S.noride=S.t;const gi=idx(GX,GY);if(b.d[gi]<0){v.dead=1;return}v.purp='leave';v.goal=null;bub(v,rej.q&&!rides.length?'⏳':rej.p&&!rides.length?'💸':'👋');v.path=pathTo(b.p,gi,b.s)}
else{v.goal=pick.o;v.path=pathTo(b.p,pick.t,b.s)}v.st='walk'}
function arrive(v){const o=v.goal;if(v.purp=='leave'){v.dead=1;return}v.st='idle';if(!o||o.dead)return;const d=D[o.type];
if(d.tk){if(opn(o)&&o.q.length<o.cap*(S.rs.done.q?3:2)&&v.m>=o.tk){o.q.push(v);v.st='queue';v.qt=0}else v.goal=null}
else if(d.pr){if(o.stock>0&&v.m>=o.pr){o.stock--;v.m-=o.pr;inc(o.pr);drop(v.tx,v.ty,1.5);d.food?v.h=0:v.th=0;v.st='buy';v.bt=1.2;bub(v,'😋')}else{if(o.stock<=0)S.stockT=S.t;v.goal=null}}}
function vis(v,dt){v.h+=.012*dt;v.th+=.016*dt;if(v.h>.7&&Math.random()<dt*.15)bub(v,'🍔');else if(v.th>.7&&Math.random()<dt*.15)bub(v,'🥤');else if(S.litter>60&&Math.random()<dt*.05)bub(v,'🤢');else if(S.ev=='hujan'&&Math.random()<dt*.05)bub(v,'☔');
if(v.st=='idle')decide(v);
else if(v.st=='walk'){if(!v.path.length){arrive(v);return}const t=v.path[0],tx=t%N+.5,ty=(t/N|0)+.5,dx=tx-v.x,dy=ty-v.y,dd=Math.hypot(dx,dy),s=2.2*dt;if(s>=dd){v.x=tx;v.y=ty;v.tx=t%N;v.ty=t/N|0;v.path.shift()}else{v.x+=dx/dd*s;v.y+=dy/dd*s}if(Math.random()<dt*.04)drop(v.tx,v.ty,.5)}
else if(v.st=='queue'){v.qt+=dt;if(v.qt>12)bub(v,'😠');if(v.qt>v.pat+12){const o=v.goal;if(o){const k=o.q.indexOf(v);if(k>=0)o.q.splice(k,1)}S.wait=S.wait*.7+9;v.st='idle';v.goal=null}}
