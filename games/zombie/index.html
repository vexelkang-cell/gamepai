<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DEAD CITY – Last Survivor | Tahap 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#d9d4c7;touch-action:none}
canvas{display:block;position:fixed;inset:0;cursor:crosshair}
#hud{position:fixed;left:14px;top:12px;width:210px;pointer-events:none}
.bar{height:12px;background:#1a1d21;border:1px solid #3a3f45;margin-bottom:6px;position:relative}
.bar i{display:block;height:100%;width:100%}
#hp i{background:#b3392f}#st i{background:#c9a43a}
.bar b{position:absolute;left:5px;top:-1px;font-size:10px;font-weight:600;color:#fff;text-shadow:0 0 3px #000}
#wpn{position:fixed;right:14px;top:12px;text-align:right;pointer-events:none;font-size:15px;line-height:1.4}
#ammo{font-size:30px;font-weight:700;color:#e8e0c8}
#dbg{position:fixed;left:14px;bottom:10px;font-size:11px;color:#8c897e;pointer-events:none;white-space:pre}
#inv{position:fixed;left:14px;top:60px;font-size:12px;color:#cfc8b2;pointer-events:none}
#feed{position:fixed;left:14px;top:82px;font-size:13px;pointer-events:none;text-shadow:0 0 3px #000}
#over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(40,0,0,.6);text-align:center}
#over h1{font-size:44px;margin:0 0 6px;color:#e04a3c;letter-spacing:2px}
#over p{margin:0;font-size:16px}
#touch{display:none}
body.t #touch{display:block}body.t #dbg{display:none}
#joy{position:fixed;left:28px;bottom:34px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2)}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.3)}
.b{position:fixed;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.b.on{background:rgba(224,74,60,.5)}
#bAtk{right:30px;bottom:50px;width:92px;height:92px;font-size:15px;background:rgba(224,74,60,.25)}
#bRel{right:140px;bottom:40px;width:62px;height:62px}
#bDash{right:30px;bottom:158px;width:62px;height:62px}
#bSpr{right:108px;bottom:120px;width:62px;height:62px}
#bWpn{right:190px;bottom:112px;width:56px;height:56px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="bar" id="hp"><i></i><b>HEALTH</b></div>
  <div class="bar" id="st"><i></i><b>STAMINA</b></div>
</div>
<div id="wpn"><div id="wn">Pistol 9mm</div><div id="ammo">12 / 60</div></div>
<div id="inv"></div><div id="feed"></div>
<div id="dbg"></div>
<div id="over"><h1>KAMU MATI</h1><p>Klik atau ketuk untuk mengulang</p></div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div class="b" id="bAtk">SERANG</div>
  <div class="b" id="bRel">RELOAD</div>
  <div class="b" id="bDash">DODGE</div>
  <div class="b" id="bSpr">SPRINT</div>
  <div class="b" id="bWpn">GANTI</div>
</div>
<script>window.addEventListener('error',function(e){var d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#700;color:#fff;font:12px monospace;padding:8px;white-space:pre-wrap';document.body.appendChild(d);}d.textContent='Error: '+e.message+' (baris '+e.lineno+')';});</script>
<script src="game.js"></script>
<script src="/vexel-leaderboard.js" data-game-id="zombie" defer></script></body>
</html>
