<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPACE FOOD DEFENDER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050817;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
header{width:min(100%,800px);display:flex;justify-content:space-between;align-items:center;font-weight:bold}
#game{width:min(100%,800px);flex:1;min-height:0;position:relative;border:2px solid #263c70;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#142b55,#050817 65%)}
canvas{width:100%;height:100%;display:block}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px;background:#050817dd;gap:12px}
.panel h1{font-size:clamp(25px,6vw,46px);margin:0;color:#75d7ff;text-shadow:0 0 18px #168cff}
.panel p{max-width:500px;line-height:1.5;color:#d6e5ff}
input,button{font-size:17px;border:0;border-radius:12px;padding:13px 18px}
input{width:min(90%,300px);text-align:center}
button{background:#168cff;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#hint{font-size:12px;color:#9fb8df}
#leader{max-height:160px;overflow:auto;width:min(100%,360px);font-size:14px;text-align:left}
#leader div{padding:5px;border-bottom:1px solid #334}
</style>
</head>
<body><div id="wrap">
<header><span>🚀 SPACE FOOD DEFENDER</span><span>SKOR: <b id="score">0</b></span></header>
<div id="game"><canvas id="c"></canvas>
<div class="panel" id="start"><h1>SPACE FOOD DEFENDER</h1><p>Tembak makanan haram dan kumpulkan makanan halal untuk mendapatkan perlindungan!</p><input id="playerName" maxlength="20" placeholder="Nama pemain"><button id="startBtn">MULAI BERMAIN</button><small id="hint">Geser jari / mouse untuk bergerak dan menembak otomatis.</small></div>
<div class="panel" id="over" style="display:none"><h1>GAME OVER</h1><p id="result"></p><button id="sendBtn">KIRIM SKOR</button><div id="sendStatus"></div><div id="leader"></div><button id="againBtn">MAIN LAGI</button></div>
</div><div id="hint">Kontrol: sentuh dan geser layar • Keyboard: ← → atau A D • Spasi untuk menembak</div></div>
<script>
const API_URL="https://vexel-games-uploader.vexelkang.workers.dev";
const GAME_ID="space-food-defender";
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=800,H=600,player={x:400,y:520},shots=[],foods=[],stars=[],score=0,halal=0,frame=0,running=false,fire=false,keys={},shield=0,rapid=0,name='';
const bad=['🐷','🍷','🥓','🍺'],good=['🍯','🥛','🌴','🍎','🍌'];
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.max(320,r.width*devicePixelRatio);canvas.height=Math.max(320,r.height*devicePixelRatio);W=canvas.width;H=canvas.height;player.y=H*.86}
window.addEventListener('resize',resize);resize();
stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5}));
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=.35+Math.random()*.5;ctx.fillRect(s.x,s.y,s.s,s.s);s.y+=s.s*.45;if(s.y>H)s.y=0}ctx.globalAlpha=1;
for(const b of shots){ctx.fillStyle='#6ff';ctx.fillRect(b.x-3,b.y,6,18)}
for(const f of foods){ctx.font=Math.round(W*.045)+'px Arial';ctx.textAlign='center';ctx.fillText(f.icon,f.x,f.y)}
ctx.font=Math.round(W*.07)+'px Arial';ctx.textAlign='center';ctx.fillText('🚀',player.x,player.y);
if(shield>0){ctx.strokeStyle='#6ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(player.x,player.y-12,32,0,Math.PI*2);ctx.stroke()}
}
function end(){running=false;$('over').style.display='flex';$('result').textContent=name+' • Skor '+score+' • Makanan halal '+halal;$('sendBtn').disabled=false;$('sendStatus').textContent='';}
function start(){name=$('playerName').value.trim()||'Pemain';localStorage.setItem('kv_space_name',name);score=0;halal=0;frame=0;foods=[];shots=[];shield=0;rapid=0;player.x=W/2;running=true;$('score').textContent=0;$('start').style.display='none';$('over').style.display='none';loop()}
function loop(){if(!running)return;frame++;score++;$('score').textContent=score;
if(keys.ArrowLeft||keys.a)player.x-=W*.009;if(keys.ArrowRight||keys.d)player.x+=W*.009;player.x=Math.max(28,Math.min(W-28,player.x));
if(frame%Math.max(18,55-Math.floor(frame/700)*3)===0){const isGood=Math.random()<.27;foods.push({x:30+Math.random()*(W-60),y:-30,v:2+Math.random()*2+frame/1500,icon:(isGood?good:bad)[Math.floor(Math.random()*(isGood?good:bad).length)],good:isGood})}
if(fire||keys[' ']){if(frame%(rapid>0?7:14)===0)shots.push({x:player.x,y:player.y-28})}
if(shield>0)shield--;if(rapid>0)rapid--;
for(const b of shots)b.y-=12;shots=shots.filter(b=>b.y>-20);
for(const f of foods){f.y+=f.v;if(Math.hypot(f.x-player.x,f.y-(player.y-10))<34){if(f.good){score+=200;halal++;shield=300;rapid=480;f.dead=true}else if(shield>0){f.dead=true;shield=0}else{end();return}}
for(const b of shots){if(!f.dead&&Math.hypot(f.x-b.x,f.y-b.y)<28){f.dead=true;b.dead=true;if(!f.good)score+=100}}
}foods=foods.filter(f=>f.y<H+40&&!f.dead);shots=shots.filter(b=>!b.dead);draw();$('score').textContent=score;requestAnimationFrame(loop)}
function pointer(e){const r=canvas.getBoundingClientRect();player.x=(e.clientX-r.left)/r.width*W;fire=true}
canvas.addEventListener('pointerdown',e=>{pointer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});canvas.addEventListener('pointerup',()=>fire=false);canvas.addEventListener('pointercancel',()=>fire=false);
window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key]=false);
function getPlayerId(playerName){const key='kv_space_player_ids';let ids={};try{ids=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const normalized=playerName.trim().toLocaleLowerCase('id-ID');if(!ids[normalized]){ids[normalized]=crypto.randomUUID();localStorage.setItem(key,JSON.stringify(ids))}return ids[normalized]}\nasync function sendScore(){const id=getPlayerId(name);$('sendBtn').disabled=true;$('sendStatus').textContent='Mengirim skor...';try{const r=await fetch(API_URL+'/leaderboard/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameId:GAME_ID,playerId:id,playerName:name,score})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal mengirim skor');$('sendStatus').textContent='✅ '+d.message+' Rekor terbaik: '+d.bestScore;await loadRanks()}catch(e){$('sendStatus').textContent='❌ '+e.message;$('sendBtn').disabled=false}}
async function loadRanks(){try{const r=await fetch(API_URL+'/leaderboard?gameId='+GAME_ID);const d=await r.json();$('leader').innerHTML='<b>🏆 10 PEMAIN TERATAS</b>'+((d.rankings||[]).slice(0,10).map((x,i)=>'<div>'+(i+1)+'. '+escapeHtml(x.playerName)+' — '+x.score+'</div>').join('')||'<div>Belum ada skor.</div>')}catch{$('leader').textContent='Papan peringkat belum dapat dimuat.'}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('startBtn').onclick=start;$('sendBtn').onclick=sendScore;$('againBtn').onclick=()=>{$('start').style.display='flex';$('over').style.display='none'};$('playerName').value=localStorage.getItem('kv_space_name')||'';draw();
</script></body></html>
