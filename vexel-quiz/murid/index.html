<style>
:root{color-scheme:dark;--line:#2b3c5b;--muted:#a9b7d0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 85% 0,#34417a66,transparent 38%),#0b1220;color:#f5f7ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(540px,100%)}
.top{display:flex;align-items:center;justify-content:center;margin-bottom:26px}

.eyebrow{font-size:10px;letter-spacing:2px;font-weight:900;color:#9fc5ff}
h1{font-size:clamp(28px,7vw,38px);line-height:1.12;margin:10px 0 12px;font-weight:950}
p{font-size:14px;color:#c1cce3;line-height:1.7;margin:0 0 25px}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 17px;border-radius:13px;background:linear-gradient(100deg,#287df1,#8554ef);font-size:14px;font-weight:950;letter-spacing:.5px}
.hint{text-align:center;color:#71809d;font-size:11px;margin-top:22px}
