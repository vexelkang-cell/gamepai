name = "vexel-games-uploader"
main = "cloudflare-worker.js"
compatibility_date = "2026-11-10"

[[d1_databases]]
binding = "DB"
database_name = "vexel-leaderboard"
database_id = "73be10d2-b2af-4b63-871e-fddf39e9fcb8"

[[durable_objects.bindings]]
name = "QUIZ_ROOM"
class_name = "QuizRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuizRoom"]

[triggers]
crons = ["0 17 * * *", "0 17 * * 1"] # Harian 00.00 WIB + fakta baru setiap Senin 00.00 WIB

[ai]
binding = "AI"
