name: Perbarui Katalog Game

on:
  push:
    branches:
      - main
      - master
    paths:
      - "games/**"
      - ".github/scripts/generate-game-catalog.mjs"
      - ".github/workflows/update-game-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

# Cegah dua proses katalog berjalan bersamaan pada branch yang sama.
concurrency:
  group: update-game-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
      - name: Buat katalog otomatis
        run: node .github/scripts/generate-game-catalog.mjs
      - name: Simpan katalog ke GitHub
        run: |
          if git diff --quiet -- games.json; then
            echo "Katalog tidak berubah."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "chore: perbarui katalog game otomatis"

          # Ambil perubahan terbaru sebelum push. Ulangi jika ada push
          # lain yang masuk tepat di antara fetch/rebase dan push.
          for attempt in 1 2 3; do
            echo "Percobaan push katalog ke-${attempt}..."
            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              echo "Rebase gagal karena konflik. Tidak ada perubahan yang dipaksakan."
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Katalog berhasil disimpan."
              exit 0
            fi

            echo "Push ditolak; akan mencoba mengambil perubahan terbaru lagi."
          done

          echo "Push gagal setelah 3 percobaan."
          exit 1
