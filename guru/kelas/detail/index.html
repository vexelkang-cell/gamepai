<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182b"><title>VEXEL QUIZ — Detail Kelas</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--line:#263650;--muted:#9eacc4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0,#29346a55,transparent 35%),var(--bg);color:#f5f7ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{width:min(900px,100%);margin:auto;padding:18px 15px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.back{color:#dce8ff;text-decoration:none;border:1px solid var(--line);padding:10px 13px;border-radius:12px;font-size:12px;font-weight:850}.brand{font-weight:950;letter-spacing:.5px}.brand span{color:#79b7ff}
.hero{padding:clamp(23px,5vw,36px);border:1px solid #638bdb55;border-radius:23px;background:radial-gradient(circle at 90% 10%,#31d49a2b,transparent 36%),linear-gradient(135deg,#14264a,#17152f);margin-bottom:18px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:900;color:#8dbaff}.hero h1{font-size:clamp(28px,7vw,42px);margin:10px 0}.hero p{color:#c1cce3;line-height:1.7;font-size:13px;margin:0}
.card{padding:clamp(17px,4vw,24px);border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#111b30,#101629);margin-bottom:15px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info{padding:15px;border:1px solid #2d4163;border-radius:14px;background:#ffffff06}.info strong{display:block;font-size:18px;margin-top:7px;overflow-wrap:anywhere}.password-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;border:1px dashed #578de0;border-radius:13px;background:#0b1730;margin-top:14px}.password-row strong{display:block;font-size:20px;letter-spacing:1px;color:#a9d0ff;overflow-wrap:anywhere;margin-top:6px}
.btn{border:0;border-radius:11px;padding:12px 15px;color:#fff;font-weight:900;font-size:12px;background:linear-gradient(105deg,#287df1,#8554ef);cursor:pointer}.btn.secondary{background:#202d49;border:1px solid #334666}.list{display:grid;gap:8px;margin-top:14px}.student{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #293b59;border-radius:11px;background:#ffffff06;font-size:13px}.student b{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:#263e68}.empty{padding:24px 12px;border:1px dashed #354968;border-radius:13px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}.message{display:none;padding:12px;border-radius:10px;margin-top:12px;font-size:12px}.message.show{display:block}.message.ok{background:#123528;color:#b4f4d6}.message.error{background:#3b1d2a;color:#ffc0cb}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-head h2{font-size:20px;margin:5px 0}
@media(max-width:520px){.summary{grid-template-columns:1fr}.password-row{align-items:flex-start;flex-direction:column}.password-row .btn{width:100%}.top .brand{display:none}}
</style></head><body><main class="wrap">
<header class="top"><a class="back" href="/guru/kelas/">← KEMBALI KE KELAS</a><div class="brand">VEXEL <span>QUIZ</span></div></header>
<section class="hero"><div class="eyebrow">AREA GURU • DETAIL KELAS</div><h1 id="className">Memuat kelas...</h1><p>Kelola informasi kelas dan pantau murid yang sudah bergabung di ruang belajar ini.</p></section>
<section class="card"><div class="summary"><div class="info"><div class="eyebrow">TINGKAT KELAS</div><strong id="classLevel">—</strong></div><div class="info"><div class="eyebrow">JUMLAH MURID</div><strong id="studentCount">0 murid</strong></div></div><div class="password-row"><div><div class="eyebrow">PASSWORD KELAS</div><strong id="classPassword">—</strong></div><button class="btn secondary" id="copyPassword" type="button">⧉ SALIN PASSWORD</button></div><div id="pageMessage" class="message"></div></section>
<section class="card"><div class="section-head"><div><div class="eyebrow">ANGGOTA KELAS</div><h2>Daftar Murid</h2></div><button class="btn secondary" id="refreshBtn" type="button">↻ MUAT ULANG</button></div><div id="studentList" class="list"><div class="empty">Memuat daftar murid...</div></div></section>
<div class="empty">VEXEL QUIZ • Ruang kelas digital</div></main>
<script>
(()=>{const API="https://vexel-games-uploader.vexelkang.workers.dev";const $=id=>document.getElementById(id);const token=()=>localStorage.getItem("vexel_player_session")||"";const id=new URLSearchParams(location.search).get("id")||"";let password="";
async function api(){const r=await fetch(API+"/quiz/classes/detail?id="+encodeURIComponent(id),{headers:{Authorization:"Bearer "+token(),"Content-Type":"application/json"},cache:"no-store"});const d=await r.json().catch(()=>({error:"Respons server tidak valid."}));if(!r.ok)throw new Error(d.error||"Kelas gagal dimuat.");return d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function message(t,type){$("pageMessage").textContent=t;$("pageMessage").className="message show "+(type||"error")}
async function load(){if(!id){$("className").textContent="Kelas tidak ditemukan";$("studentList").innerHTML='<div class="empty">ID kelas tidak tersedia.</div>';return}try{const d=await api(),c=d.class;password=c.password||"";$("className").textContent="🏫 "+c.name;$("classLevel").textContent=c.classLevel;$("studentCount").textContent=(c.studentCount||0)+" murid";$("classPassword").textContent=password||"Password lama tidak tersedia";$("copyPassword").disabled=!password;$("studentList").innerHTML=c.students.length?c.students.map((s,i)=>'<div class="student"><b>'+(i+1)+'</b><span>'+esc(s.nickname)+'</span></div>').join(""):'<div class="empty">Belum ada murid yang bergabung ke kelas ini.</div>'}catch(e){$("className").textContent="Kelas tidak dapat dibuka";$("studentList").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
$("copyPassword").addEventListener("click",async()=>{if(!password)return;try{await navigator.clipboard.writeText(password);message("Password berhasil disalin.","ok")}catch(_){message("Gagal menyalin password. Silakan salin secara manual.","error")}});$("refreshBtn").addEventListener("click",load);load()})();
</script></body></html>
